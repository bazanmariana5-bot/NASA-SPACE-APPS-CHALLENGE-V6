<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060912">
  <script>
    /* Aplica el tema antes del primer dibujado (evita el destello): elección guardada, o la del sistema. */
    (function () {
      var t = "dark";
      try {
        var v = localStorage.getItem("ks-theme");
        t = v === "light" || v === "dark" ? v : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "light" ? "#eef2fa" : "#060912");
    })();
  </script>
  <title>Kinesoft: Asistente Médico de Tripulación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* css/base.css — Variables de diseño, reinicio y tipografía. */

:root {
  /* ---- Tema oscuro (predeterminado) ---- */
  --bg: #060912;
  --glass: rgba(16, 24, 44, .62);
  --line: rgba(140, 180, 255, .16);
  --tx: #e8eefc;
  --mu: #8d9bb8;
  --ac: #7fb2ff;
  --ok: #2ee6a6;
  --warn: #ffb547;
  --bad: #ff6b6b;
  --s3: #6d788f;

  --on-ac: #06101f;          /* texto sobre el color de acento */
  --on-ok: #042;             /* texto sobre fondo --ok */
  --ac-rgb: 127, 178, 255;   /* acento en RGB, para fondos translúcidos */
  --fig-rgb: 190, 215, 255;  /* trazos de la figura anatómica */
  --edge-rgb: 5, 8, 18;      /* contornos de zonas */

  --surf: rgba(10, 16, 32, .55);   /* tarjetas */
  --field: rgba(5, 8, 18, .7);     /* campos de formulario */
  --solid: #0a1020;                /* diálogos */
  --drawer: rgba(8, 12, 26, .95);  /* menú lateral y tooltip */
  --scrim: rgba(0, 0, 0, .55);
  --scrim-dlg: rgba(0, 0, 0, .7);
  --hov: rgba(255, 255, 255, .08);
  --bx: #10192e;                   /* caja de las pruebas */
  --toast-bad: #1a0f1a;

  --sky-1: rgba(90, 70, 200, .28);
  --sky-2: rgba(20, 120, 170, .22);
  --star-1: #fff;
  --star-2: #cfe0ff;
  --star-op: 1;

  --sil: #9ec5ff;
  --sil-fill: #0a1128;
  --sel: #fff;               /* resalte de selección y puntos reales */
  --grid: #8cb4ff;           /* rejilla de los gráficos */

  --cw1: #7fb2ff;            /* colores de tripulantes */
  --cw2: #ff8ad8;
  --cw3: #ffd23f;

  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---- Tema claro ---- */
:root[data-theme="light"] {
  --bg: #eef2fa;
  --glass: rgba(255, 255, 255, .74);
  --line: rgba(30, 60, 120, .18);
  --tx: #0f1a33;
  --mu: #55627d;
  --ac: #2a5fd1;
  --ok: #0a8f65;
  --warn: #b36b00;
  --bad: #d12f45;
  --s3: #7b869e;

  --on-ac: #fff;
  --on-ok: #fff;
  --ac-rgb: 42, 95, 209;
  --fig-rgb: 40, 70, 130;
  --edge-rgb: 255, 255, 255;

  --surf: rgba(255, 255, 255, .62);
  --field: rgba(255, 255, 255, .9);
  --solid: #fff;
  --drawer: rgba(255, 255, 255, .97);
  --scrim: rgba(15, 26, 51, .35);
  --scrim-dlg: rgba(15, 26, 51, .5);
  --hov: rgba(15, 26, 51, .07);
  --bx: #dfe7f6;
  --toast-bad: #fff0f2;

  --sky-1: rgba(90, 70, 200, .12);
  --sky-2: rgba(20, 120, 170, .1);
  --star-1: #3d5aa0;
  --star-2: #5a74b8;
  --star-op: .35;

  --sil: #3d6bc4;
  --sil-fill: #d6e1f5;
  --sel: #0f1a33;
  --grid: #28468c;

  --cw1: #2a5fd1;
  --cw2: #c2288f;
  --cw3: #a87400;

  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 400 15px/1.5 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
}

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}


/* css/layout.css — Fondo, encabezado, controles, botones, drawer, héroe y pestañas. */

.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(60% 50% at 80% 10%, var(--sky-1), transparent),
              radial-gradient(50% 40% at 10% 90%, var(--sky-2), transparent);
}

.sky i {
  position: absolute;
  inset: -260px 0 0;
  background-image: radial-gradient(1.5px 1.5px at 20px 30px, var(--star-1), transparent),
                    radial-gradient(1px 1px at 90px 80px, var(--star-2), transparent),
                    radial-gradient(1.2px 1.2px at 150px 140px, var(--star-1), transparent);
  background-size: 180px 180px;
  opacity: calc(.55 * var(--star-op));
  animation: drift 90s linear infinite;
}

.sky i + i {
  background-size: 260px 260px;
  opacity: calc(.35 * var(--star-op));
  animation-duration: 150s;
}

@keyframes drift {
  to {
    transform: translateY(260px);
  }
}

.g {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 10px 14px;
  margin: 8px;
  border-radius: 16px;
}

header h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 700;
  flex: 1;
  min-width: 140px;
}

.ctl {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--mu);
}

select,
input,
textarea {
  background: var(--field);
  color: var(--tx);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
  font-size: 14px;
  min-width: 0;
}

select:focus,
input:focus,
textarea:focus,
button:focus-visible,
summary:focus-visible,
.z:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}

input[type=range] {
  padding: 0;
  accent-color: var(--ac);
  width: 130px;
}

button {
  font: inherit;
  color: var(--tx);
  cursor: pointer;
}

.btn {
  background: var(--ac);
  color: var(--on-ac);
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 700;
}

.btn.o {
  background: transparent;
  color: var(--tx);
  border: 1px solid var(--line);
}

.btn.sm {
  padding: 5px 10px;
  font-size: 13px;
}

.ib {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 18px;
}

/* Botón de tema: muestra el ícono de lo que se activará al tocarlo (sol en oscuro, luna en claro). */
#theme {
  display: inline-grid;
  place-items: center;
  padding: 0;
}

#theme .ic { display: block; }
:root[data-theme="light"] #theme .ic-sun,
:root:not([data-theme="light"]) #theme .ic-moon { display: none; }

.app {
  position: relative;
  z-index: 1;
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 8px 40px;
  display: grid;
  gap: 12px;
}

#drawer {
  position: fixed;
  z-index: 40;
  inset: 0 auto 0 0;
  width: 340px;
  max-width: 90vw;
  overscroll-behavior: contain;
  transform: translateX(-105%);
  transition: transform .3s;
  padding: 16px;
  border-radius: 0 18px 18px 0;
  background: var(--drawer);
  overflow: auto;
}

#drawer.open {
  transform: none;
}

#scrim {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: var(--scrim);
  display: none;
}

#scrim.on {
  display: block;
}

.crew {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 14px;
  background: transparent;
  border: 1px solid var(--line);
}

.crew.on {
  background: rgba(var(--ac-rgb), .14);
  border-color: var(--ac);
}

.crew b {
  display: block;
  font-size: 14px;
}

.crew span {
  font-size: 12px;
  color: var(--mu);
}

.av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #2b4fa8, #6a4fd8);
  font-weight: 700;
  flex: none;
}

.hero {
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
}

.hero h2 {
  margin: 4px 0 2px;
  font-size: 24px;
}

.hero p {
  margin: 0;
  color: var(--mu);
  font-size: 13px;
}

.kp {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.kp div {
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  text-align: center;
}

.kp small {
  display: block;
  color: var(--mu);
  font-size: 11px;
}

.kp b {
  font-size: 20px;
}

.bd {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid currentColor;
  font-weight: 500;
}

.bd::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.t0 { color: var(--ok); }
.t1 { color: var(--warn); }
.t2 { color: var(--bad); }
.t3 { color: var(--s3); }

.rail {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.rail::-webkit-scrollbar {
  display: none;
}

.rail > * {
  scroll-snap-align: start;
  flex: none;
}

.rw {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rw .rail {
  flex: 1;
}

.rw .ib {
  display: none;
}

@media (min-width: 900px) {
  .rw .ib {
    display: block;
  }
}

.tab {
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: transparent;
  font-weight: 500;
  white-space: nowrap;
}

.tab.on {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
}

.stage {
  display: grid;
  gap: 12px;
}

.stage.anim > * {
  animation: in .4s ease;
}

@keyframes in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

.pn {
  padding: 16px;
}

.svgw {
  display: grid;
  place-items: center;
  border-radius: 14px;
  min-height: 380px;
  position: relative;
}

/* ---- Selector de idioma ES | EN ----
   Control propio con los mismos tokens que el resto de la cabecera; maneja el
   widget de Google Translate, que queda oculto. */
#google_translate_element {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.lang {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.lang svg {
  margin: 0 4px 0 6px;
  color: var(--mu);
  flex: none;
}

.lang button {
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--mu);
  transition: background .15s, color .15s;
}

.lang button:hover {
  background: var(--hov);
  color: var(--tx);
}

.lang button[aria-pressed="true"] {
  background: var(--ac);
  color: var(--on-ac);
}

/* Oculta la barra y los resaltes que Google Translate inyecta en la página. */
body { top: 0 !important; }
.skiptranslate:not(#google_translate_element):not(.lang),
iframe.skiptranslate,
.goog-te-banner-frame,
#goog-gt-tt,
.goog-tooltip { display: none !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }


/* css/anatomy.css — Figura anatómica SVG y estados por zona. */

svg.body {
  width: 100%;
  max-width: 270px;
  height: auto;
}

.sil-a * {
  fill: none;
  stroke: var(--sil);
  stroke-opacity: .6;
  stroke-width: 3;
  stroke-linejoin: round;
}

.sil-b * {
  fill: var(--sil-fill);
  stroke: none;
}

.sil-c * {
  fill: url(#bs);
  fill-opacity: .26;
  stroke: none;
}

.gh {
  pointer-events: none;
}

.gh .f {
  fill: rgba(var(--fig-rgb), .07);
  stroke: rgba(var(--fig-rgb), .2);
  stroke-width: .6;
}

.gh .s {
  fill: none;
  stroke: rgba(var(--fig-rgb), .18);
}

.gh .d,
.gh .k {
  fill: none;
  stroke: none;
}

.rings circle {
  fill: none;
  stroke: rgba(var(--ac-rgb), .14);
  stroke-dasharray: 2 5;
}

.scan {
  fill: rgba(var(--ac-rgb), .35);
  animation: scan 5s linear infinite;
}

@keyframes scan {
  from { transform: translateY(0); }
  to { transform: translateY(470px); }
}

.z {
  cursor: pointer;
  transition: color .4s, filter .4s;
}

.z .f {
  fill: currentColor;
  fill-opacity: .62;
  stroke: rgba(var(--edge-rgb), .55);
  stroke-width: .7;
}

.z .s {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-opacity: .9;
}

.z .d {
  fill: none;
  stroke: rgba(var(--edge-rgb), .6);
  stroke-width: .9;
  stroke-linecap: round;
  pointer-events: none;
}

.z .k {
  fill: var(--bg);
  fill-opacity: .85;
  pointer-events: none;
}

.z.s0 { color: var(--ok); filter: drop-shadow(0 0 3px rgba(46, 230, 166, .6)); }
.z.s1 { color: var(--warn); filter: drop-shadow(0 0 3px rgba(255, 181, 71, .7)); }
.z.s2 { color: var(--bad); filter: drop-shadow(0 0 4px rgba(255, 107, 107, .85)); }
.z.s3 { color: var(--s3); filter: none; }

.z.sel .f {
  stroke: var(--sel);
  stroke-width: 1.2;
  fill-opacity: .88;
}

.z.sel {
  filter: drop-shadow(0 0 2px var(--sel)) drop-shadow(0 0 7px currentColor);
}

.z:hover {
  opacity: .82;
}

#tip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 12px;
  background: var(--drawer);
  border: 1px solid var(--line);
  display: none;
  white-space: nowrap;
}


/* css/components.css — Tarjetas, barras, leyendas, formularios, diálogo y toast. */

.card {
  width: 240px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  text-align: left;
  display: block;
}

.card.sel {
  border-color: var(--ac);
  box-shadow: 0 0 0 1px var(--ac);
}

.card small {
  color: var(--mu);
}

.card .v {
  font-size: 24px;
  font-weight: 700;
  margin: 4px 0;
}

.card .v em {
  font-style: normal;
  font-size: 12px;
  color: var(--mu);
  font-weight: 400;
}

.bar {
  height: 6px;
  border-radius: 9px;
  background: var(--hov);
  overflow: hidden;
  margin: 8px 0;
}

.bar i {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: currentColor;
  transition: width .5s;
}

.src {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 6px;
  background: rgba(var(--ac-rgb), .15);
  color: var(--ac);
  font-style: normal;
}

.src.r {
  background: var(--ac);
  color: var(--on-ac);
  font-weight: 700;
}

details {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  margin-top: 8px;
}

summary {
  cursor: pointer;
  color: var(--ac);
  font-size: 13px;
}

details p {
  color: var(--mu);
  font-size: 13px;
  margin: 6px 0;
}

.lg {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--mu);
  margin-top: 4px;
}

.pl {
  display: grid;
  gap: 6px;
  margin: 8px 0;
}

.pr {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 13px;
}

.pr.on {
  border-color: var(--ac);
  background: rgba(var(--ac-rgb), .1);
}

.pr > span:last-child {
  grid-column: 1 / -1;
}

.pr em {
  font-style: normal;
  font-size: 11px;
  color: var(--mu);
}

.two {
  display: grid;
  gap: 12px;
}

@media (min-width: 900px) {
  .two.fig {
    grid-template-columns: 320px 1fr;
  }
}

@media (max-width: 899px) {
  .xs {
    display: none;
  }
}

dialog {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--solid);
  color: var(--tx);
  padding: 18px;
  width: min(620px, 94vw);
  max-height: 92vh;
}

dialog::backdrop {
  background: var(--scrim-dlg);
}

.fg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.fg label {
  font-size: 12px;
  color: var(--mu);
  display: grid;
  gap: 4px;
}

.w {
  grid-column: 1 / -1;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 13px;
}

.chip.on {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
}

.sw {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.sw button {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 2px solid transparent;
  font-weight: 700;
  color: #06101f;
}

.big {
  min-height: 170px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  user-select: none;
  touch-action: manipulation;
  padding: 12px;
}

table.tb {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.tb td,
.tb th {
  padding: 6px 8px;
  border-top: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.tb th {
  color: var(--mu);
  font-weight: 500;
}

.alert {
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid currentColor;
  margin: 8px 0;
  font-size: 13px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ok);
  color: var(--on-ok);
  padding: 8px 16px;
  border-radius: 99px;
  font-weight: 700;
  opacity: 0;
  transition: opacity .3s;
  z-index: 70;
  pointer-events: none;
}

#toast.on {
  opacity: 1;
}

a {
  color: var(--ac);
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- Íconos dibujados en CSS (sin caracteres especiales) ---------- */
.icon-menu {
  display: inline-block;
  width: 18px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  box-shadow: 0 -6px 0 currentColor, 0 6px 0 currentColor;
  vertical-align: middle;
}

.icon-close {
  position: relative;
  display: inline-block;
  width: 14px;
  height: 14px;
  vertical-align: middle;
}

.icon-close::before,
.icon-close::after {
  content: "";
  position: absolute;
  top: 6px;
  left: -1px;
  width: 16px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
}

.icon-close::before { transform: rotate(45deg); }
.icon-close::after { transform: rotate(-45deg); }

/* css/panel.css — Panel: selector de tripulante y cuadrícula de gráficos. */

/* ==========================================================================
   PANEL: SELECTOR DE TRIPULANTE Y CUADRÍCULA DE GRÁFICOS
   ========================================================================== */

.ccw {
  display: grid;
  gap: 10px;
  margin-top: 12px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

.cc {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  position: relative;
  overflow: hidden;
}

.cc::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--cc);
}

.cc.on {
  border-color: var(--cc);
  background: rgba(var(--ac-rgb), .1);
  box-shadow: 0 0 0 1px var(--cc);
}

.cc .av {
  width: 44px;
  height: 44px;
  font-size: 18px;
}

.ci {
  flex: 1;
  min-width: 0;
}

.ci b {
  display: block;
  font-size: 14px;
}

.ci > span {
  font-size: 12px;
  color: var(--mu);
}

.mini {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.mini i {
  font-style: normal;
  font-size: 11px;
}

.cg {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

.gc {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: grid;
  gap: 6px;
  align-content: start;
  transition: border-color .2s;
}

.gc:hover,
.gc:focus-visible {
  border-color: var(--ac);
}

.gc header small {
  display: block;
  color: var(--mu);
  font-size: 12px;
}

.gc header b {
  font-size: 15px;
}

.gv {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.gv .mono {
  font-size: 26px;
  font-weight: 500;
}

.gv em {
  font-style: normal;
  font-size: 12px;
  color: var(--mu);
}

.gv .bd {
  margin-left: auto;
}

.gc footer {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--mu);
  flex-wrap: wrap;
}


/* css/registro.css — Registro por zona. */

/* ==========================================================================
   REGISTRO POR ZONA
   ========================================================================== */

.rf {
  display: block;
  font-size: 11px;
  color: var(--mu);
  margin-top: 2px;
}

.rf .bd {
  font-size: 10px;

}

.zc {
  display: inline-flex;

}

  font-style: normal;
}

.tb tr.cur td {

}

@media (max-width: 560px) {

  }

/* css/alerts.css — Avisos flotantes (amarillo y rojo). */

/* ==========================================================================
   ALERTAS: AVISO AMARILLO Y AVISO ROJO
   ========================================================================== */


/* ---------- Avisos flotantes (amarillo y rojo): no bloquean la pantalla ---------- */
#alert-toast-yellow,
#alert-toast-red {
  position: fixed;
  top: calc(72px + env(safe-area-inset-top, 0px));
  right: 20px;
  z-index: 100;
  max-width: 340px;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
  transform: translateY(-20px);
  opacity: 0;
  pointer-events: none;
  transition: transform .3s ease, opacity .3s ease;
}

#alert-toast-yellow {
  background: rgba(255, 181, 71, .96);
  color: #06101f;
  border: 1px solid rgba(255, 255, 255, .85);
}

#alert-toast-red {
  background: var(--toast-bad);
  color: var(--tx);
  border: 2px solid var(--bad);
  box-shadow: 0 0 22px rgba(255, 107, 107, .5);
  padding-right: 40px;
}

#alert-toast-yellow.on,
#alert-toast-red.on {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

#alert-toast-yellow:hover,
#alert-toast-red:hover { filter: brightness(1.06); }

.alert-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
#alert-toast-red .alert-head { color: var(--bad); }
.alert-go { font-size: 11px; opacity: .8; }
.alert-body { font-weight: 500; }
#alert-toast-red .mono { color: var(--bad); font-weight: 700; }

.alert-x {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--mu);
  font-size: 14px;
  cursor: pointer;
}
.alert-x:hover { background: var(--hov); color: var(--tx); }

/* barra que se vacía durante el tiempo que dura el aviso */
.alert-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: 100%;
  background: currentColor;
  opacity: .55;
  transform-origin: left;
  animation: alertCountdown var(--alert-ms, 5000ms) linear forwards;
}
#alert-toast-red .alert-bar { background: var(--bad); }
.paused .alert-bar { animation-play-state: paused; }

@keyframes alertCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

@media (max-width: 520px) {
  #alert-toast-yellow,
  #alert-toast-red { left: 12px; right: 12px; max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  #alert-toast-yellow,
  #alert-toast-red { transition: none; }
  .alert-bar { animation: none; }
}
/* ---------- Emergencia vital: centrado, persistente y distinto a los avisos normales ---------- */
#alert-toast-vital {
  position: fixed;
  top: calc(72px + env(safe-area-inset-top, 0px));
  left: 50%;
  z-index: 110;
  width: min(560px, calc(100% - 24px));
  padding: 16px 46px 16px 18px;
  border-radius: 14px;
  background: #2a0a10;
  color: #fff;
  border: 3px solid #ff2d3d;
  box-shadow: 0 0 0 4px rgba(255, 45, 61, .25), 0 10px 40px rgba(255, 45, 61, .6);
  cursor: pointer;
  transform: translate(-50%, -20px);
  opacity: 0;
  pointer-events: none;
  transition: transform .3s ease, opacity .3s ease;
}
#alert-toast-vital.on {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
  animation: vitalPulse 1s ease-in-out infinite;
}
#alert-toast-vital .alert-head { color: #ff5a67; font-weight: 700; letter-spacing: .04em; }
#alert-toast-vital .alert-body { font-size: 15px; font-weight: 600; line-height: 1.45; }
#alert-toast-vital .alert-sub { margin-top: 8px; font-size: 12px; color: #ffb3b9; }

@keyframes vitalPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(255, 45, 61, .25), 0 10px 40px rgba(255, 45, 61, .6); }
  50% { box-shadow: 0 0 0 10px rgba(255, 45, 61, .12), 0 10px 56px rgba(255, 45, 61, .9); }
}

/* ---- helpers de modelo fisiológico ---- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const P = (id, n, u, base, v, dir, y, r, d = 1, x = {}) => ({ id, n, u, base, v, dir, y, r, d, ...x });
const dens = r => P("dens", "Densidad ósea relativa", "% del basal", 100, c => 100 - r * c.m * c.f * c.k, "lt", 97, 94);
const load = () => P("load", "Carga mecánica diaria", "% de la meta", 100, c => c.d ? 55 + 45 * c.adh : 100, "lt", 85, 70, 0);
const mus = (id, n, u, b, r, ty = .05, tr = .1, d = 1) => P(id, n, u, b, c => b * (1 - r / 100 * c.m * c.f * c.k), "lt", b * (1 - ty), b * (1 - tr), d);

/* rigidez muscular (miotonómetro): cae con la atrofia/hipotonía en microgravedad. stiff(id, nombre, base, %caída por mes) */
const stiff = (id, n, b, r) => mus(id, n, "N/m", b, r, .05, .1);
const mt = (id, n, u, b, r, dir, y, rd, d = 1) => P(id, n, u, b, c => b * (1 + r / 100 * c.m * c.f * c.k), dir, y, rd, d);
const fl = (id, n, u, b, r, dir, y, rd, d = 1) => P(id, n, u, b, c => b * (1 + r / 100 * c.m * c.fk), dir, y, rd, d);
const ev0 = (id, n, u, fn, y, r) => P(id, n, u, 0, fn, "gt", y, r, 0);

const SI0 = .67 * 85 + .28 * 1600 - 420,
      buaF = c => 85 * (1 - .012 * c.m * c.f * c.k),
      sosF = c => 1600 * (1 - .0015 * c.m * c.f * c.k),
      siF = c => .67 * buaF(c) + .28 * sosF(c) - 420,
      tF = c => (siF(c) - SI0) / 8,
      zF = c => tF(c) + .4,
      lossF = c => (SI0 - siF(c)) / SI0 * 100;

const fiF = c => clamp(Math.round(6 + 5 * Math.max(0, lossF(c)) + 14 * Math.max(0, -(zF(c) + .5))), 0, 100),
      dH = c => 4.6 * (1 - Math.exp(-c.d / 18)) * c.gz;

/* importer.js — lector CSV que respeta comillas y validación de filas importadas (CSV o SVG). Funciones puras, sin DOM. */
"use strict";

const norm = s => String(s == null ? "" : s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/* CSV: no divide a ciegas por comas. Una coma, un punto y coma o un salto de línea dentro de comillas pertenece al campo;
   "" dentro de un campo entrecomillado es una comilla literal. Detecta "," o ";" mirando solo la primera línea fuera de comillas. */
function csvParse(text) {
  text = String(text).replace(/^\uFEFF/, "");
  let q = false, nc = 0, ns = 0;
  
  for (const ch of text) {
    if (ch === '"') {
      q = !q;
    } else if (!q) {
      if (ch === "\n" || ch === "\r") break;
      if (ch === ",") nc++;
      else if (ch === ";") ns++;
    }
  }

  const D = ns > nc ? ";" : ",";
  const rows = [];
  let row = [], f = "", inQ = false;

  const end = () => {
    row.push(f);
    f = "";
    if (row.some(x => x.trim() !== "")) rows.push(row);
    row = [];
  };

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          f += '"';
          i++;
        } else {
          inQ = false;
        }
      } else {
        f += ch;
      }
    } else if (ch === '"' && f === "") {
      inQ = true;
    } else if (ch === D) {
      row.push(f);
      f = "";
    } else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      end();
    } else {
      f += ch;
    }
  }

  if (inQ) throw new Error("Comillas sin cerrar en el CSV");
  if (f !== "" || row.length) end();
  
  return rows;
}

/* número: acepta "58.2" y "58,2" (coma decimal); cualquier otra cosa es NaN */
function parseNum(x) {
  let t = String(x == null ? "" : x).trim().replace(/\s/g, "");
  if (t === "") return NaN;
  if (/^[-+]?\d+,\d+$/.test(t)) t = t.replace(",", ".");
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t) ? +t : NaN;
}

/* tabla -> filas {c,d,k,v}. Formato largo: dia,tripulante,parametro,valor. Formato ancho: dia,[tripulante],zona.param,zona.param… */
function tableToRows(t) {
  if (t.length < 2) return { rows: [], err: "El CSV no tiene filas de datos." };

  const h = t[0].map(norm),
        at = n => h.findIndex(x => n.includes(x)),
        iD = at(["dia", "day"]);

  if (iD < 0) return { rows: [], err: 'Falta la columna "dia".' };

  const iC = at(["tripulante", "crew", "persona"]),
        iK = at(["parametro", "clave", "key"]),
        iV = at(["valor", "value"]),
        skip = ["nota", "notas", "observacion", "observaciones"],
        rows = [];

  t.slice(1).forEach(r => {
    const c = iC >= 0 ? (r[iC] || "").trim() : "",
          d = parseNum(r[iD]);

    if (iK >= 0 && iV >= 0) {
      rows.push({ c, d, k: (r[iK] || "").trim(), v: parseNum(r[iV]) });
    } else {
      t[0].forEach((name, j) => {
        if (j === iD || j === iC || skip.includes(h[j]) || !(r[j] || "").trim()) return;
        rows.push({ c, d, k: name.trim(), v: parseNum(r[j]) });
      });
    }
  });

  return { rows };
}

/* validación: o = {today, known:Set, crew:fn(texto)->id|null, negOk:fn(clave)->bool} */
function validateRows(rows, o) {
  const good = [],
        rej = { crew: 0, unk: 0, bad: 0, neg: 0, rng: 0 };

  rows.forEach(r => {
    const c = o.crew(r.c);
    if (c == null) {
      rej.crew++;
      return;
    }
    if (!o.known.has(r.k)) {
      rej.unk++;
      return;
    }
    if (!Number.isFinite(r.v)) {
      rej.bad++;
      return;
    }
    if (r.v < 0 && !o.negOk(r.k)) {
      rej.neg++;
      return;
    }
    if (!Number.isInteger(r.d) || r.d < 0 || r.d >= o.today) {
      rej.rng++;
      return;
    }
    good.push({ c, d: r.d, k: r.k, v: r.v });
  });

  return { good, rej };
}

/* js/core/store.js — Persistencia de registros (localStorage). */
"use strict";

/* ---------- StorageManager ---------- */
const Store = {
  K: "orbital_logs_v4",
  ver: 0,
  _r: null,
  _o: {},
  all() {
    try {
      const r = localStorage.getItem(this.K) || "{}";
      if (r !== this._r) { this._o = JSON.parse(r); this._r = r; }
      return this._o;
    } catch (e) { return {}; }
  },
  days(c) { return this.all()[c] || {}; },
  get(c, d) { return this.days(c)[d]; },
  put(c, d, patch) {
    try {
      const a = this.all(),
            r = (a[c] = a[c] || {})[d] = a[c][d] || { v: {}, t: {} };
      Object.assign(r.v, cleanV(patch.v));
      Object.assign(r.t, patch.t || {});
      if (patch.n != null) r.n = patch.n;
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}
  },
  setZone(c, d, zid, v, n) {
    try {
      const a = this.all(),
            r = (a[c] = a[c] || {})[d] = a[c][d] || { v: {}, t: {} };
      Object.keys(r.v).forEach(k => { if (k.indexOf(zid + ".") === 0) delete r.v[k]; });
      Object.assign(r.v, cleanV(v));
      r.zn = r.zn || {};
      if (n) r.zn[zid] = n; else delete r.zn[zid];
      if (!Object.keys(r.v).length && !Object.keys(r.t || {}).length && !Object.keys(r.zn).length && !r.n) delete a[c][d];
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}
  },
  del(c, d) {
    try {
      const a = this.all();
      if (a[c]) delete a[c][d];
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}

function insp(z) {

const NECK_IDS = ["ecm", "trapecio", "esplenio", "largocuello", "multifidos"];

const zoneFig = (tab, zs, sel, nochips) => {
  const cls = {};

function viewRisks() {

<div class="g pn" id="guia"><b>Guía rápida de indicadores</b>${GUIDE.map(g => `<details><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join("")}</div>
<div class="g pn" id="rec"><b>Recursos oficiales</b><ul>${LINKS.map(l => `<li><a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a></li>`).join("")}</ul></div>`;
}

function viewPanel() {

  return `<div class="rw u-jc-space-between"><b>${z.n}</b>${bd(Engine.ev(z).st)}</div><p class="u-m-2-0-10 u-c-mu u-fs-13">${esc(crewOf().name)} · ${z.src}</p>
<div class="fg"><label>Día de misión<input type="number" id="fday" min="0" max="${S.today}" value="${S.day}"></label><div class="u-as-end u-fs-12 u-c-mu">Deja vacío un campo para usar el modelo simulado.</div>
${z.p.map((p, i) => {
  const k = z.id + "." + p.id,
        v = rec.v && rec.v[k] != null ? rec.v[k] : "",
        cv = v !== "" ? v : p.v(c),
        s = stat(p, cv);
  return `<label>${esc(p.n)} (${esc(p.u)})<input type="number" step="any" inputmode="decimal" data-f="${k}" ${NEGOK.has(k) ? "" : 'min="0"'} value="${v}" placeholder="${fmt(p, p.v(c))}"><span class="rf"><span id="rs-${p.id}">${s >= 0 ? bd(s) : ""}</span> ${refText(p)}</span></label>`;
}).join("")}
<label class="w">Observaciones de esta zona<textarea id="zn" rows="2" placeholder="Ej.: molestia al agacharse, medición repetida…">${esc(note)}</textarea></label></div>
<div class="row u-jc-flex-end u-mt-12"><button class="btn o" id="zdel">Borrar esta zona del día</button><button class="btn" id="zsv">Guardar registro</button></div>`;
}

function regHistory(z) {
  if (!z.p.length) return "";

        pre = z.id + ".",
        rows = Object.entries(days).filter(([d, r]) => Object.keys(r.v || {}).some(k => k.indexOf(pre) === 0)).sort((a, b) => b[0] - a[0]).slice(0, 14),

function renderChrome() {

  <script>
/* js/ui/plan.js — Pestaña "Plan de ejercicio": rutinas priorizadas por el estado de cada zona (modelo del html Control de Salud Orbital),
   entrenamiento cervical con casco lastrado y plan de estabilización para el regreso (parámetros del PDF NASA). */
"use strict";

/* ---------- Rutinas: zones = zonas cuyo estado fija la prioridad; adh = puntos de cumplimiento que suma al completarla ---------- */
const ROUT = [
  { id: "ared", t: "Resistencia en ARED: tren inferior", min: 45, adh: 10, zones: ["pelvis", "femur", "tibia", "pie", "muslo", "cadera", "pantorrilla"], why: "Carga el hueso y el músculo para frenar la pérdida de densidad y de masa.", steps: ["Sentadillas con barra: 3 series de 10", "Peso muerto: 3 series de 8", "Elevación de talones: 3 series de 15", "Registrar la carga (kgf) y las repeticiones logradas"] },
  { id: "lumbar", t: "Movilidad lumbar y contramedidas para la columna vertebral", min: 20, adh: 5, zones: ["lumbar", "core"], why: "Alivia los discos que se expandieron y protege la columna.", steps: ["Colocar el traje de compresión axial durante 1 a 2 horas", "Llevar las rodillas al pecho: 3 repeticiones de 30 segundos", "Rotación suave de tronco sentado: 10 por lado", "Puntuar el dolor lumbar de 0 a 10"] },
  { id: "casco", t: "Entrenamiento con casco lastrado de resistencia multidireccional", min: 15, adh: 5, zones: ["cervical", "ecm", "trapecio", "esplenio", "largocuello", "multifidos"], why: "Incluye los movimientos de flexión cervical, extensión cervical, inclinación derecha e izquierda y rotaciones, todos con resistencia ajustable para permitir el fortalecimiento de la musculatura cervical.", steps: ["Flexión cervical con resistencia ajustable", "Extensión cervical con resistencia ajustable", "Inclinación derecha e izquierda con resistencia ajustable", "Rotaciones derecha e izquierda con resistencia ajustable", "Registrar la resistencia usada en cada movimiento"] },
  { id: "eva", t: "Movilidad post-EVA: manos y hombros", min: 10, adh: 5, zones: ["hombros", "brazos", "antebrazo", "humero"], why: "Recupera movilidad tras el uso del traje espacial.", steps: ["Círculos de hombros: 2 series de 10", "Estiramiento de flexores de muñeca: 30 segundos por lado", "Apertura y cierre de manos: 3 series de 15", "Medir la fuerza de agarre con el dinamómetro"] },
  { id: "cardio", t: "Aeróbico con arnés e hidratación", min: 35, adh: 5, zones: ["corazon", "vasos", "pulmones"], why: "Mantiene el corazón y la circulación activos frente al corrimiento de líquidos.", steps: ["Beber 500 mL antes de empezar", "30 minutos de trote en cinta con arnés a ritmo moderado", "Enfriar 5 minutos y registrar la frecuencia cardíaca"] },
  { id: "resp", t: "Respiración diafragmática y descompresión mental", min: 10, adh: 0, zones: ["pulmones", "cerebro"], why: "Mejora la ventilación y ayuda a sobrellevar el aislamiento.", steps: ["Sentarse con la espalda apoyada y una mano en el abdomen", "Inhalar 4 segundos y exhalar 6 segundos, 5 minutos", "Cerrar con 3 minutos de atención en los sonidos del entorno"] },
  { id: "vest", t: "Equilibrio y entrenamiento vestibular", min: 15, adh: 0, zones: ["cerebro", "corazon"], why: "Prepara el sistema del equilibrio para volver a la gravedad.", steps: ["Movimientos lentos de cabeza con la vista fija: 2 series de 10", "Marcha en tándem con apoyo: 2 pasadas", "Pasar de acostado a de pie en 3 tiempos"] },
  { id: "hid", t: "Hidratación y prevención renal", min: 5, adh: 0, zones: ["rinones"], why: "Diluye el calcio en orina y reduce el riesgo de cálculos.", steps: ["Planificar entre 2,5 y 3 L de agua en el día", "Revisar el sodio de las comidas", "Registrar la diuresis"] },
  { id: "regreso", t: "Plan estabilización y acondicionamiento para el regreso", min: 25, adh: 5, zones: ["corazon", "vasos"], why: "Para contrarrestar la hipovolemia plasmática, la falla vasomotora y barorrefleja, utiliza los parámetros del PDF de la NASA: índice de Valsalva, curva de presión arterial y evaluación de compensación de fuerza G.", steps: ["Fase 1, pre-reentrada (72 a 24 h): maniobra anti-G M-1/L-1 con biofeedback y carga resistiva del tren inferior", "Fase 2, reentrada (1,5 G a 4 G): contracción isométrica de miembros inferiores con metrónomo M-1/L-1", "Fase 3, posaterrizaje (2 h): bombeo de tobillos, sedestación asistida y bipedestación progresiva"] }
];

const PLAN_LV = ["Mantenimiento", "Recomendada", "Prioridad alta"];

/* ---------- Progreso por tripulante (localStorage): rutinas completadas por día y datos del test de Valsalva ---------- */
const Plan = {
  K: "orbital_plan_v1",
  ver: 0,
  d: {},
  load() {
    try { this.d = JSON.parse(localStorage.getItem(this.K) || "{}") || {}; } catch (e) { this.d = {}; }
  },
  save() {
    try { localStorage.setItem(this.K, JSON.stringify(this.d)); } catch (e) {}
  },
  of(c = S.crew) {
    const o = this.d[c] = this.d[c] || {};
    o.done = o.done || {};
    o.vs = o.vs || {};
    return o;
  },
  isDone(rid) {
    const o = this.of();
    return !!(o.done[S.day] && o.done[S.day][rid]);
  }
};
Plan.load();

/* ---------- Clasificación del PDF NASA: índice de Valsalva + curva de presión arterial (Fase II tardía y Fase IV) ---------- */
const VS_OK = 1.21,   /* mayor a 1,21 = respuesta autonómica intacta (óptimo 1,4 a 1,5) */
      VS_RED = 1.10;  /* menor a 1,10 = riesgo crítico de síncope */

const VS_LV = [
  ["Nivel verde", "Apto estándar"],
  ["Nivel amarillo", "Riesgo moderado: alerta de precarga"],
  ["Nivel rojo", "Riesgo crítico de síncope"]
];

const nf = (v, d = 2) => v.toFixed(d).replace(".", ",");

function vsEval(v = {}) {
  const ratio = v.fmax > 0 && v.fmin > 0 ? v.fmax / v.fmin : null,
        red = [],
        yel = [];

  if (ratio != null) {
    if (ratio < VS_RED) red.push(`Índice de Valsalva ${nf(ratio)} (menor a 1,10)`);
    else if (ratio <= VS_OK) yel.push(`Índice de Valsalva ${nf(ratio)} (entre 1,10 y 1,21)`);
  }
  if (v.f2 === "cae") red.push("Fase II tardía: la presión sigue cayendo sin recuperarse (falla vasoconstrictora)");
  if (v.f4 === "ausente") red.push("Fase IV: ausencia total de rebote de la presión arterial");
  else if (v.f4 === "atenuado") yel.push("Fase IV: rebote atenuado");

  const full = ratio != null && !!v.f2 && !!v.f4,
        any = ratio != null || !!v.f2 || !!v.f4;
  let lv = null;
  if (red.length) lv = 2;
  else if (yel.length) lv = 1;
  else if (full) lv = 0;

  return { ratio, lv, why: lv === 2 ? red.concat(yel) : yel, full, any, g: v.g || null };
}

const vsBadge = r => r.lv == null ? `<span class="bd t3">${r.any ? "Evaluación incompleta" : "Sin evaluar"}</span>` : `<span class="bd t${r.lv}">${VS_LV[r.lv][0]}</span>`;

/* Dosificación del plan según el nivel (PDF): verde = estándar; amarillo y rojo = bloques ampliados. */
function vsPlan(lv) {
  const strong = lv >= 1,
        dose = strong ? "5 bloques de 6 ciclos, 3 veces al día, vigilando que la frecuencia cardíaca suba de forma controlada y sin mareos" : "3 bloques de 4 ciclos (3 s de tensión y 1 s de respiro), 2 veces al día";
  return { dose, strong };
}

function vsResult(r) {
  const odd = r.ratio != null && (r.ratio < 1 || r.ratio > 3) ? `<div class="alert t1">Revisa las frecuencias cardíacas: el cociente ${nf(r.ratio)} es poco plausible (la FC máxima de la Fase II debería ser mayor que la mínima de la Fase IV).</div>` : "";
  const lead = odd + (r.lv == null
    ? `<p class="u-fs-13 u-c-mu">${r.any ? "Faltan datos para clasificar: se necesitan el índice de Valsalva (FC máxima de Fase II y FC mínima de Fase IV), la Fase II tardía y la Fase IV." : "Ingresa los parámetros del test de Valsalva para clasificar al tripulante."}</p>`
    : `<div class="alert t${r.lv}"><b>${VS_LV[r.lv][0]} · ${VS_LV[r.lv][1]}.</b>${r.why.length ? `<ul class="u-m-6-0">${r.why.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}${r.lv === 0 ? " Índice de Valsalva sobre 1,21 con recuperación en Fase II tardía y rebote presente en Fase IV." : ""}${r.lv === 1 ? " Indica pérdida significativa de volumen plasmático: requiere expansión volémica y entrenamiento muscular previo." : ""}${r.lv === 2 ? " Requiere protocolo máximo de contramedidas físicas, carga hidrosalina obligatoria, prendas anti-G y reentrada y aterrizaje estrictamente en decúbito." : ""}${!r.full && r.lv < 2 ? " <small>Resultado provisional: faltan datos por ingresar.</small>" : ""}</div>`);
  const g = r.g === "pierde" ? `<div class="alert t1"><b>Compensación de fuerza G alterada.</b> Pérdida de visión periférica (grey-out) o blackout: repetir el entrenamiento de la maniobra M-1/L-1 en centrífuga. <small>El PDF no asigna este parámetro al nivel automático; se muestra como indicador aparte.</small></div>`
    : r.g === "ok" ? `<div class="alert t0"><b>Compensación de fuerza G conservada.</b> Mantiene perfusión cerebral y visión periférica entre 1,5 G y 4 G.</div>` : "";
  const dz = r.lv != null ? vsPlan(r.lv) : null;
  const plan = dz ? `<p class="u-fs-13"><b class="u-c-tx">Dosis de la Fase 1 para este nivel:</b> ${dz.dose}.${r.lv === 2 ? " En la reentrada: contracción isométrica continua de miembros inferiores durante todo el pico de desaceleración, con inflado automático del traje anti-G." : ""}</p>` : "";
  return lead + g + plan;
}

/* ---------- Prioridad de cada rutina (0 mantenimiento, 1 recomendada, 2 alta) ---------- */
function routineLevel(r) {
  if (r.id === "regreso") {
    const e = vsEval(Plan.of().vs);
    if (e.lv != null) return e.lv;
  }
  return Math.max(0, ...r.zones.map(id => {
    const z = ZONES.find(q => q.id === id),
          s = z ? Engine.ev(z).st : 3;
    return s < 3 ? s : 0;
  }));
}

const planRows = () => ROUT.map(r => ({ r, p: routineLevel(r) })).sort((a, b) => b.p - a.p);

function planToday() {
  const R = planRows(),
        pri = R.filter(x => x.p > 0),
        mins = pri.reduce((a, x) => a + x.r.min, 0),
        z = ZONES.find(q => q.id === "lumbar"),
        gain = z && Engine.ev(z).rows.find(x => x.p.id === "dhp"),
        rec = gain && gain.v >= 3 ? `<div class="alert t2" role="status"><b>Recomendación:</b> ${HEIGHT_REC}. <small>Ganancia de estatura de ${fmt(gain.p, gain.v)} %.</small></div>` : "";
  return `<b>Receta del día ${S.day}</b>${rec}${pri.length ? `<p class="u-m-6-0 u-fs-13">${pri.length} rutina${pri.length === 1 ? "" : "s"} recomendada${pri.length === 1 ? "" : "s"}, unos ${mins} minutos. Prioridad: <b class="u-c-tx">${pri[0].r.t}</b>.</p>` : `<p class="u-m-6-0 u-fs-13">Sin prioridades. Mantén la rutina normal de misión.</p>`}`;
}

/* ---------- Tarjeta del test de Valsalva y plan en 3 fases (PDF NASA) ---------- */
function regresoBody() {
  const v = Plan.of().vs,
        sel = (k, opts) => `<select data-vs="${k}" aria-label="${k}"><option value="">Sin dato</option>${opts.map(o => `<option value="${o[0]}" ${v[k] === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select>`,
        num = (k, ph) => `<input type="number" step="any" inputmode="decimal" min="1" data-vs="${k}" placeholder="${ph}" value="${v[k] != null ? v[k] : ""}">`,
        r = vsEval(v);

  return `<div class="fg vsf">
<label>FC máxima en Fase II (lpm)${num("fmax", "Ej.: 95")}</label>
<label>FC mínima en Fase IV (lpm)${num("fmin", "Ej.: 68")}</label>
<label class="w">Curva de presión arterial · Fase II tardía (antes de los 15 s)${sel("f2", [["rec", "Recupera: la presión sube de nuevo"], ["cae", "Caída continua sin recuperación"]])}</label>
<label class="w">Curva de presión arterial · Fase IV (rebote u overshoot)${sel("f4", [["presente", "Presente: supera el valor basal"], ["atenuado", "Atenuado"], ["ausente", "Ausente"]])}</label>
<label class="w">Evaluación de compensación de fuerza G (maniobra M-1/L-1, 1,5 G a 4 G)${sel("g", [["ok", "Mantiene perfusión cerebral y visión periférica"], ["pierde", "Pierde visión periférica (grey-out) o blackout"]])}</label>
</div>
<p class="u-fs-12 u-c-mu u-m-6-0">Índice de Valsalva = FC máxima de la Fase II ÷ FC mínima de la Fase IV. Normal: mayor a 1,21 (óptimo 1,4 a 1,5). Valor calculado: <b class="mono u-c-tx" id="vsratio">${r.ratio != null ? nf(r.ratio) : "—"}</b></p>
<div id="vsres">${vsResult(r)}</div>
<details><summary>Plan en 3 fases</summary>
<p><b class="u-c-tx">Fase 1 · Acondicionamiento pre-reentrada (últimas 72 a 24 horas en órbita).</b> Reactivar el tono vasoconstrictor simpático, estimular la retención de volumen plasmático y entrenar la bomba muscular periférica.</p>

</ul></details>
<details><summary>Reglas de seguridad</summary>
<ul>
<li>Bloqueo de Valsalva puro en Tierra: si el tripulante contiene la respiración más de 4 s sin contracción muscular periférica al levantarse, avisar de inmediato: “¡Suelta el aire y contrae las piernas!”.</li>
<li>Alerta prodrómica: ante visión en túnel, sudoración fría o náuseas, suspender la bipedestación y pasar a posición horizontal con las piernas elevadas a 45°.</li>
</ul></details>`;
}

function routineCard(x) {
  const { r, p } = x,
        ok = Plan.isDone(r.id),
        reg = r.id === "regreso";
  return `<section class="card plc" id="pl-${r.id}"><div class="rw u-jc-space-between u-gap-8"><h3>${r.t}</h3><span class="bd t${p}" ${reg ? 'id="vsbd"' : ""}>${PLAN_LV[p]}</span></div><p class="mono u-m-6-0">${r.min} min</p><p class="u-m-0 u-fs-13 u-c-mu">${r.why}</p><ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join("")}</ol><div class="plb">${reg ? '<button class="btn o sm" data-vs-open>Test de Valsalva y plan detallado</button>' : ""}<button class="btn" data-done="${r.id}" ${ok ? "disabled" : ""}>${ok ? "Completada" : "Completar rutina"}</button></div></section>`;
}

function viewPlan() {
  const cr = crewOf();
  return `<div class="g pn"><div class="rw u-jc-space-between u-fw-wrap u-gap-10"><div><b>Plan de ejercicio de ${cr.name}</b><p class="u-m-2-0-0 u-c-mu u-fs-13">Las rutinas se ordenan según el estado de cada zona del cuerpo en el día ${S.day}. Completar una rutina mejora el cumplimiento de ejercicio del modelo.</p></div></div></div>
<div class="g pn" id="pl-hoy">${planToday()}</div>
<div class="plg" id="pl-rut">${planRows().map(routineCard).join("")}</div>`;
}

/* ---------- Eventos de la pestaña ---------- */
document.addEventListener("click", e => {
  if (!e.target.closest("[data-vs-open]")) return;
  openDlg(head("Test de Valsalva y plan en 3 fases", "Parámetros del PDF de la NASA.") + regresoBody() + foot());
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-done]");
  if (!b || b.disabled) return;
  const r = ROUT.find(x => x.id === b.dataset.done);
  if (!r) return;
  const o = Plan.of();
  (o.done[S.day] = o.done[S.day] || {})[r.id] = 1;
  cfg().adh = Math.min(100, cfg().adh + r.adh);
  Plan.save();
  Plan.ver++;
  toast("Rutina completada");
  render();
});

/* Cada cambio del test de Valsalva actualiza solo el resultado (sin remontar la vista, para no perder el foco al escribir). */
function vsInput(e) {
  const el = e.target,
        k = el.dataset && el.dataset.vs;
  if (!k) return;
  const v = Plan.of().vs;
  if (el.tagName === "SELECT") v[k] = el.value || null;
  else { const n = parseFloat(el.value); v[k] = n > 0 ? n : null; }
  Plan.save();
  const r = vsEval(v),
        set = (id, h) => { const n = $(id); if (n) n.innerHTML = h; };
  set("vsres", vsResult(r));
  set("vsratio", r.ratio != null ? nf(r.ratio) : "—");
  set("pl-hoy", planToday());
  const bd2 = $("vsbd");
  if (bd2) {
    const p = routineLevel(ROUT.find(x => x.id === "regreso"));
    bd2.className = "bd t" + p;
    bd2.textContent = PLAN_LV[p];
  }
}
document.addEventListener("input", vsInput);
document.addEventListener("change", vsInput);

  <script>
/* js/ui/events.js — Eventos globales, tooltip y controles del encabezado. */
"use strict";

/* ---------- Eventos ---------- */
const tip = $("tip");
document.addEventListener("click", e => {
  const t = e.target.closest("[data-t],[data-open],[data-z],[data-c],[data-r],[data-p],[data-go],[data-gz],[data-cat],[data-cmp],[data-rl],[data-reg],[data-day],#zsv,#zdel");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "zsv") return saveZone();
  if (t.id === "zdel") return delZone();
  if (d.open) return openTest(d.open);
  if (d.t) Nav.go({ tab: d.t, quiet: 1 });
  else if (d.go) Nav.go({ tab: d.go });
  else if (d.gz) {
    const [zi, ix] = d.gz.split(":"),
          z = ZONES.find(q => q.id === zi);
    Nav.go({ tab: z.tab, z: zi, p: +ix });
  } else if (d.cat) State({ cat: d.cat });
  else if (d.cmp) State({ cmp: S.cmp ? 0 : 1 });
  else if (d.rl) { Nav.go({ tab: "registro", rl: d.rl, quiet: 1 }); }
  else if (d.reg) {
    const z = ZONES.find(q => q.id === d.reg);
    Nav.go({ tab: "registro", rl: z.tab, z: z.id });
  } else if (d.day != null) State({ day: +d.day });
  else if (d.z) Nav.pick(d.z);
  else if (d.p != null) Nav.par(+d.p);
  else if (d.c) { State({ crew: d.c }); closeDrawer(); }
  else if (d.r) {
    const r = $(d.r),
          c = r.firstElementChild;
    r.scrollBy({ left: d.d * (c ? c.offsetWidth + 10 : 260), behavior: "smooth" });
  }
});

document.addEventListener("keydown", e => {
  const el = e.target;
  if ((e.key === "Enter" || e.key === " ") && el.dataset && (el.dataset.z || el.dataset.gz) && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) {
    e.preventDefault();
    el.click();
  }
});

document.addEventListener("pointermove", e => {
  const z = e.target.closest && e.target.closest("svg .z");
  if (!z) { tip.style.display = "none"; return; }
  const zz = ZONES.find(q => q.id === z.dataset.z && q.tab === layer());
  if (!zz) return;
  const x = Engine.ev(zz),
        f = x.rows[0];
  tip.innerHTML = `${zz.n}${f ? `: <b>${fmt(f.p, f.v)} ${f.p.u}</b>` : ""} · ${SN[x.st]}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 260) + "px";
  tip.style.top = e.clientY + 14 + "px";
});

document.addEventListener("input", e => {
  const i = e.target;
  if (!i.dataset || !i.dataset.f) return;
  const [zid, pid] = i.dataset.f.split("."),
        z = ZONES.find(q => q.id === zid),
        p = z.p.find(q => q.id === pid),
        el = $("rs-" + pid);
  if (!el) return;
  const v = parseFloat(i.value),
        x = isNaN(v) ? p.v(C()) : v,
        s = stat(p, x);
  el.innerHTML = s >= 0 ? bd(s) : "";
});

document.addEventListener("change", e => {

/* js/tests/colors.js — Prueba: test de colores. */
"use strict";

/* --- Test de colores --- */
function tColors() {
  const seq = [];
  while (seq.length < 10) {
    const i = Math.floor(Math.random() * 10),
          n = seq.length;
    if (n >= 2 && seq[n - 1] === i && seq[n - 2] === i) continue;
    seq.push(i);
  }
  openDlg(head("Test secuencial de colores", "Memoriza 10 colores y repítelos en el mismo orden. Dura menos de 45 s.") +
    `<div class="big" id="bx">Preparado</div><div id="pad" class="sw">${PALETTE.map((p, i) => `<button data-k="${i}" style="background:${p[1]}">${p[0]}</button>`).join("")}</div><div id="res"></div>` +
    foot('<button class="btn" id="go">Comenzar</button>'));
  $("go").onclick = () => {
    $("go").disabled = true;
    let c = 3;
    const bx = $("bx");
    const tick = () => {
      if (c > 0) {
        bx.textContent = c--;
        later(tick, 1000);
      } else show(0);
    };
    tick();

    function show(i) {
      if (i >= 10) {
        bx.style.background = "var(--bx)";
        bx.textContent = "¡Repite la secuencia!";
        $("pad").style.display = "grid";
        return play();
      }
      bx.style.background = PALETTE[seq[i]][1];
      bx.textContent = PALETTE[seq[i]][0];
      bx.style.color = "#06101f";
      later(() => {
        bx.style.background = "var(--bx)";
        bx.textContent = "";
        later(() => show(i + 1), 300);
      }, 600);
    }

    function play() {
      const taps = [], t0 = performance.now();
      later(() => fin(taps, t0), 30000);
      $("pad").onclick = e => {
        const b = e.target.closest("[data-k]");
        if (!b || taps.length >= 10) return;
        taps.push([+b.dataset.k, performance.now()]);
        bx.textContent = taps.length + " / 10";
        if (taps.length === 10) {
          clr();
          fin(taps, t0);
        }
      };
    }

    function fin(taps, t0) {
      $("pad").style.display = "none";
      const acc = taps.filter((t, i) => t[0] === seq[i]).length;
      let span = 0;
      while (span < taps.length && taps[span][0] === seq[span]) span++;
      const T = taps.length === 10 ? taps[9][1] - t0 : 30000,
            lat = taps.length ? taps[0][1] - t0 : 30000,
            gaps = taps.map((t, i) => t[1] - (i ? taps[i - 1][1] : t0)),
            itv = taps.length > 1 ? gaps.slice(1).reduce((a, b) => a + b, 0) / (taps.length - 1) : 0,
            lap = gaps.slice(1).filter(g => g > 2000).length;
      const sv = T <= 6000 ? 20 : T <= 12000 ? 20 * (1 - (T - 6000) / 6000) : 0,
            score = Math.round(clamp(acc * 5 + span * 3 + sv - lap * 5, 0, 100)),
            cls = COG.find(c => score >= c[0]);
      save({ "cognicion.cog": score, "cognicion.acc": acc, "cognicion.span": span, "cognicion.lat": Math.round(lat), "cognicion.itv": Math.round(itv), "cognicion.lap": lap }, { colors: { score, cls: cls[1] } });
      $("res").innerHTML = alertBox(score >= 85 ? 0 : score >= 70 ? 1 : 2, `Puntaje <b>${score}/100</b> · ${cls[1]}<br>${cls[2]}`) + `<p class="mono u-fs-12 u-c-mu">Aciertos ${acc}/10 · racha ${span} · latencia ${Math.round(lat)} ms · intervalo medio ${Math.round(itv)} ms · lapsos ${lap}</p>`;
      $("bx").textContent = "Fin";
    }
  };
}

/* js/tests/pvt.js — Prueba: PVT de reacción. */
"use strict";

/* --- Reacción (PVT) --- */
function tPVT() {
  openDlg(head("Test de reacción", "Toca en cuanto el botón cambie de rojo a verde. 3 intentos válidos.") +
    `<div class="big" id="bx">Preparado</div><div id="res"></div>` +
    foot('<button class="btn" id="go">Comenzar</button>'));
  let st = "idle", t0 = 0, tr = [], fs = 0;
  const bx = $("bx");

  function wait() {
    st = "red";
    bx.style.background = "#b8323f";
    bx.textContent = "ESPERA…";
    later(() => {
      st = "green";
      bx.style.background = "#1fbf86";
      bx.style.color = "#04140d";
      bx.textContent = "¡AHORA!";
      t0 = performance.now();
    }, 2000 + Math.random() * 4000);
  }

  bx.addEventListener("pointerdown", () => {
    if (st === "red") {
      clr();
      fs++;
      st = "pause";
      bx.textContent = "¡Muy pronto! Espera al verde";
      later(wait, 1200);
    } else if (st === "green") {
      const t = Math.round(performance.now() - t0);
      tr.push(t);
      st = "pause";
      bx.textContent = t + " ms";
      later(() => tr.length < 3 ? wait() : fin(), 1500);
    }
  });

  $("go").onclick = () => {
    $("go").disabled = true;
    wait();
  };

  function fin() {
    st = "done";
    const avg = tr.reduce((a, b) => a + b, 0) / 3,
          base = REACT.find(r => avg <= r[0]),
          lap = tr.filter(t => t > 500).length;
    let sc = base[1];
    if (fs >= 2) sc -= 1;
    if (lap >= 1) sc -= 2;
    sc = Math.max(1, sc);
    save({ "reaccion.rt": Math.round(avg), "reaccion.fast": Math.min(...tr), "reaccion.rs": sc, "reaccion.fs": fs, "reaccion.rl": lap }, { pvt: { trials: tr, sc } });
    bx.style.background = "var(--bx)";
    bx.style.color = "";
    bx.textContent = "Fin";
    $("res").innerHTML = alertBox(sc >= 6 ? 0 : sc >= 5 ? 1 : 2, `Puntaje <b>${sc}/10</b> · ${base[2]}. ${base[3]}<br>Habilitación para EVA: <b>${sc >= 6 ? "sí" : "no"}</b> (se requiere 6 o más)`) + `<p class="mono u-fs-12 u-c-mu">Intentos ${tr.join(" · ")} ms · promedio ${Math.round(avg)} ms · salidas en falso ${fs} · lapsos ${lap}</p>`;
  }
}

  <script>
/* js/features/upload.js — Carga de días anteriores (SVG o CSV). */
"use strict";

/* ---------- Carga de días anteriores (SVG o CSV) ---------- */
const KNOWN = () => {
  const k = new Set();
  ZONES.forEach(z => z.p.forEach(p => k.add(z.id + "." + p.id)));
  return k;
};

const crewRes = x => {
  const t = norm(x);
  if (!t) return S.crew;
  const c = CREW.find(q => norm(q.id) === t || norm(q.name) === t || norm(q.name.split(" ").slice(-1)[0]) === t);
  return c ? c.id : null;
};

const crewFor = tg => x => {
  const t = norm(x);
  if (tg === "all") return t ? crewRes(x) : null;
  if (!t) return tg;
  return crewRes(x) === tg ? tg : null;
};

function svgParse(txt) {
  const doc = new DOMParser().parseFromString(txt, "image/svg+xml"),
        root = doc.documentElement;
  if (!root || doc.querySelector("parsererror") || root.localName !== "svg") return null;
  const rows = [],
        push = (c, d, k, v) => rows.push({ c: c || "", d: parseNum(d), k: String(k || "").trim(), v: parseNum(v) });
  
  doc.querySelectorAll("metadata").forEach(m => {
    try {
      const j = JSON.parse(m.textContent);
      Object.entries(j.data || {}).forEach(([d, o]) => Object.entries(o || {}).forEach(([k, v]) => push(j.crew, d, k, v)));
      Object.entries(j.crews || {}).forEach(([c, dd]) => Object.entries(dd || {}).forEach(([d, o]) => Object.entries(o || {}).forEach(([k, v]) => push(c, d, k, v))));
    } catch (e) {}
  });
  
  doc.querySelectorAll("[data-k][data-v]").forEach(el => {
    const dn = el.closest("[data-day]"), cn = el.closest("[data-crew]");
    push(cn && cn.getAttribute("data-crew"), el.getAttribute("data-day") != null ? el.getAttribute("data-day") : dn && dn.getAttribute("data-day"), el.getAttribute("data-k"), el.getAttribute("data-v"));
  });
  return rows;
}

function applyRows(rows, tg) {
  const { good, rej } = validateRows(rows, { today: S.today, known: KNOWN(), crew: crewFor(tg), negOk: k => NEGOK.has(k) }),
        by = {};
  let over = 0;
  
  good.forEach(r => {
    const o = by[r.c + "|" + r.d] = by[r.c + "|" + r.d] || { c: r.c, d: r.d, v: {} },
          pv = Store.get(r.c, r.d);
    if (pv && pv.v && pv.v[r.k] != null && pv.v[r.k] !== r.v) over++;
    o.v[r.k] = r.v;
  });
  
  Object.values(by).forEach(o => Store.put(o.c, o.d, { v: o.v }));
  const per = {};
  good.forEach(r => per[r.c] = (per[r.c] || 0) + 1);
  return { per, ok: good.length, days: Object.keys(by).length, over, rej };
}

const impReport = (r, tg) => {
  const j = r.rej,
        x = [
          [j.neg, "con valor negativo (no permitido)"],
          [j.rng, `con día fuera de 0 a ${S.today - 1}`],
          [j.unk, "con parámetro desconocido"],
          [j.bad, "con valor no numérico"],
          [j.crew, tg === "all" ? "sin tripulante o desconocido (con “Los 3 juntos” cada fila debe indicar su tripulante)" : "de otro tripulante o desconocido (solo se cargan las filas de " + crewOf(tg).name + " o sin tripulante)"]
        ].filter(q => q[0]);
  return alertBox(r.ok ? (x.length ? 1 : 0) : 2, `Se cargaron <b>${r.ok}</b> valores en <b>${r.days}</b> día${r.days === 1 ? "" : "s"}${r.over ? ` (${r.over} reemplazaron valores anteriores)` : ""}.` + (tg === "all" && r.ok ? "<br>" + CREW.map(c => c.name + ": " + (r.per[c.id] || 0)).join(" · ") : "") + x.map(q => `<br>${q[0]} ${q[1]}.`).join(""));
};

const histHtml = c => {
  const rows = Object.entries(Store.days(c)).filter(([d, r]) => r.v && Object.keys(r.v).length).sort((a, b) => b[0] - a[0]),
        tot = rows.reduce((s, [d, r]) => s + Object.keys(r.v).length, 0);
  return `<b>Historial de ${esc(crewOf(c).name)}</b> <small class="u-c-mu">${rows.length} día${rows.length === 1 ? "" : "s"} · ${tot} valores reales</small>` + (rows.length ? `<div class="u-ox-auto u-maxh-150 u-mt-6"><table class="tb"><tr><th>Día</th><th>Valores</th></tr>${rows.slice(0, 10).map(([d, r]) => `<tr><td>${d}</td><td>${Object.keys(r.v).length}</td></tr>`).join("")}</table></div>` : '<p class="u-c-mu u-fs-13 u-m-6-0-0">Sin registros reales todavía.</p>');
};

const histFor = t => t === "all" ? CREW.map(c => histHtml(c.id)).join('<hr class="u-bd-0 u-bt-1-solid-line u-m-10-0">') : histHtml(t);
const csvCell = x => { x = String(x); return /[",;\r\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };

function download(name, type, body) {
  const u = URL.createObjectURL(new Blob([body], { type })),
        l = document.createElement("a");
  l.href = u;
  l.download = name;
  document.body.appendChild(l);
  l.click();
  l.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

function csvExport(tg) {
  const ids = tg === "all" ? CREW.map(c => c.id) : [tg || S.crew],
        L = ["dia,tripulante,parametro,valor"];
  ids.forEach(cid => Object.entries(Store.days(cid)).filter(([d]) => +d < S.today).sort((a, b) => a[0] - b[0]).forEach(([d, r]) => Object.entries(r.v || {}).forEach(([k, v]) => L.push([d, cid, k, v].map(csvCell).join(",")))));
  download(`respaldo_${tg === "all" ? "tripulacion" : tg || S.crew}_dia${S.today}.csv`, "text/csv;charset=utf-8", "\uFEFF" + L.join("\r\n") + "\r\n");
}

function svgExport(tg) {
  tg = tg || S.crew;
  const zs = ZONES.find(z => z.id === S.sel[layer()]) || ZONES.find(z => z.tab === "musculos"),
        pr = zs.p.length ? zs.p[Math.min(S.par[zs.id] || 0, zs.p.length - 1)] : null;
  const of = cid => {
    const o = {};
    Object.entries(Store.days(cid)).forEach(([d, r]) => { if (+d < S.today && r.v && Object.keys(r.v).length) o[d] = r.v; });
    return o;
  };
  const pl = tg === "all" ? { app: "kinesoft-orbital", crews: Object.fromEntries(CREW.map(c => [c.id, of(c.id)])) } : { app: "kinesoft-orbital", crew: tg, data: of(tg) };
  const meta = `<metadata>${esc(JSON.stringify(pl))}</metadata><desc>Formato: data = {día: {zona.parametro: valor}}. Solo se leen días anteriores al día ${S.today}.</desc>`,
        ch = pr ? lineChartRaw(zs, pr, { w: 560, h: 220 }) : '<svg viewBox="0 0 560 220"></svg>';
  download(`respaldo_${tg === "all" ? "tripulacion" : tg}_dia${S.today}.svg`, "image/svg+xml", ch.replace(/<svg /, '<svg xmlns="http://www.w3.org/2000/svg" ').replace(/<svg[^>]*>/, m => m + meta));
}

const readText = f => f.text ? f.text() : new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(r.result);
  r.onerror = () => no(new Error("no se pudo leer el archivo"));
  r.readAsText(f);
});

async function loadFile(f) {
  const res = $("res");
  if (!f) return;
  res.innerHTML = alertBox(1, "Leyendo " + esc(f.name) + "…");
  try {
    const txt = await readText(f),
          csv = /\.csv$/i.test(f.name) || /csv/.test(f.type);
    let rows;
    if (csv) {
      const tb = tableToRows(csvParse(txt));
      if (tb.err) return res.innerHTML = alertBox(2, esc(tb.err));
      rows = tb.rows;
    } else {
      rows = svgParse(txt);
      if (!rows) return res.innerHTML = alertBox(2, "El archivo no es un SVG válido. Si es una tabla, usa .csv.");
    }
    if (!rows.length) return res.innerHTML = alertBox(1, "El archivo no trae datos que leer.");
    res.innerHTML = impReport(applyRows(rows, upTarget), upTarget);
    $("hist").innerHTML = histFor(upTarget);
  } catch (e) {
    res.innerHTML = alertBox(2, "No se pudo leer el archivo: " + esc(e.message));
  }
}

let upTarget = S.crew;
function openUpload() {
  const t = S.today;
  upTarget = S.crew;
  openDlg(head("Cargar días anteriores", "Archivo SVG or CSV con días de 0 a " + (t - 1) + ".") +
    `<div class="row u-mb-10" id="ups"><b class="u-fs-13">Cargar para:</b>${CREW.map(c => `<button type="button" class="chip ${c.id === upTarget ? "on" : ""}" data-up="${c.id}">${esc(c.name)}</button>`).join("")}<button type="button" class="chip" data-up="all">Los 3 juntos</button></div>
    <div class="row"><label class="btn u-cur-pointer" for="upf">Elegir archivo (.svg o .csv)</label><input class="u-pos-absolute u-w-1 u-h-1 u-op-0" type="file" id="upf" accept=".svg,.csv,image/svg+xml,text/csv">
    <button type="button" class="btn o sm" id="csvx">Plantilla CSV</button><button type="button" class="btn o sm" id="svgx">Plantilla SVG</button></div>
    <div class="u-m-10-0 u-p-14 u-bd-1-dashed-line u-br-12 u-ta-center u-c-mu u-fs-13" id="drop">o arrastra aquí el archivo</div>
    <details><summary>Formato aceptado</summary><p><b class="u-c-tx">CSV</b>: <code>dia,tripulante,parametro,valor</code>.</p><p><b class="u-c-tx">SVG</b>: <code>&lt;metadata&gt;</code> con JSON.</p></details>
    <div id="res"></div><div class="u-mt-10" id="hist">${histHtml(S.crew)}</div>` + foot());
  
  $("upf").onchange = e => { loadFile(e.target.files[0]); e.target.value = ""; };
  $("csvx").onclick = () => csvExport(upTarget);
  $("svgx").onclick = () => svgExport(upTarget);
  
  $("ups").onclick = e => {
    const b = e.target.closest("[data-up]");
    if (!b) return;
    upTarget = b.dataset.up;
    $("ups").querySelectorAll("[data-up]").forEach(x => x.classList.toggle("on", x === b));
    $("hist").innerHTML = histFor(upTarget);
    $("res").innerHTML = "";
  };

  const dz = $("drop");
  dz.ondragover = e => { e.preventDefault(); dz.style.borderColor = "var(--ac)"; };
  dz.ondragleave = () => { dz.style.borderColor = ""; };
  dz.ondrop = e => { e.preventDefault(); dz.style.borderColor = ""; loadFile(e.dataTransfer.files[0]); };
}

  <script>
/* js/features/alerts.js — Alertas dinámicas (amarilla y roja). */
"use strict";

/* ==========================================================================
   Sistema de alertas dinámicas (amarilla y roja)
   Ambas son avisos flotantes que NO bloquean la pantalla y se cierran solos.
   ========================================================================== */
const ALERT_MS = { yellow: 6500, red: 5000 };

let activeAlertTarget = null;
let lastAlertSignature = "";
const alertTimers = { yellow: null, red: null, vital: null };
let lastVitalSig = "";

const alertEls = () => ({ yellow: $("alert-toast-yellow"), red: $("alert-toast-red"), vital: $("alert-toast-vital") });

function hideAlert(kind) {
  const el = alertEls()[kind];
  clearTimeout(alertTimers[kind]);
  if (el) el.classList.remove("on", "paused");
}

/* Muestra el aviso y lo oculta tras ALERT_MS. */
function showAlert(kind, html) {
  const el = alertEls()[kind];
  if (!el) return;

  hideAlert(kind === "red" ? "yellow" : "red");

  el.innerHTML = html;
  el.style.setProperty("--alert-ms", ALERT_MS[kind] + "ms");

  /* reinicia la barra de cuenta regresiva */
  el.classList.remove("on", "paused");
  void el.offsetWidth;
  el.classList.add("on");

  clearTimeout(alertTimers[kind]);
  alertTimers[kind] = setTimeout(() => hideAlert(kind), ALERT_MS[kind]);
}
/* Busca emergencias vitales en los 3 tripulantes */
function findEmergencies() {
  const out = [];
  CREW.forEach(cr => ZONES.forEach(z => {
    Engine.ev(z, C(S.day, cr), cr.id).rows.forEach(r => {
      const rules = EMERG[z.id + "." + r.p.id];
      if (!rules) return;
      const hit = rules.find(([op, lim]) => op === "lt" ? r.v <= lim : r.v >= lim);
      if (hit) out.push({ cr, z, r, txt: hit[2] });
    });
  }));
  return out;
}

function showVital(e) {
  const el = alertEls().vital;
  if (!el) return;
  activeAlertTarget = e;
  el.innerHTML = `
    <button type="button" class="alert-x" data-alert-close="vital" aria-label="Descartar emergencia"><span class="icon-close" aria-hidden="true"></span></button>
    <div class="alert-head"><span>[ ! ] ALERTA CRÍTICA · EMERGENCIA VITAL</span><span class="alert-go">Ir →</span></div>
    <div class="alert-body">${esc(EMERG_MSG(e.cr.name, e.txt))}</div>
    <div class="alert-sub mono">${esc(e.z.n)} · ${esc(e.r.p.n)}: ${fmt(e.r.p, e.r.v)} ${esc(e.r.p.u)}</div>
  `;
  el.classList.add("on");
}
function checkAndTriggerAlerts(force = false) {
  const al = Engine.alerts();

    const em = findEmergencies();
  if (em.length) {
    const e = em[0];
    const vs = `${e.cr.id}|${S.day}|${e.z.id}.${e.r.p.id}`;
    if (force || vs !== lastVitalSig) {
      lastVitalSig = vs;
      hideAlert("yellow");
      hideAlert("red");
      showVital(e);
    }
    return;
  }
  lastVitalSig = "";
  hideAlert("vital");

  if (!al.length) {
    lastAlertSignature = "";
    activeAlertTarget = null;
    hideAlert("yellow");
    hideAlert("red");
    return;
  }

  const redAlert = al.find(a => a.r.s === 2);
  const yellowAlert = al.find(a => a.r.s === 1);
  const target = redAlert || yellowAlert;

  const sig = `${S.crew}|${S.day}|${S.env}|${target.z.id}.${target.r.p.id}|${target.r.s}`;
  if (!force && sig === lastAlertSignature) return;
  lastAlertSignature = sig;

  if (redAlert) triggerRedAlert(redAlert);
  else triggerYellowAlert(yellowAlert);
}

const alertValue = a =>
  `${esc(a.z.n)} · ${esc(a.r.p.n)}: <span class="mono">${fmt(a.r.p, a.r.v)} ${esc(a.r.p.u)}</span>`;

function triggerYellowAlert(alertObj) {
  activeAlertTarget = alertObj;
  showAlert("yellow", `
    <div class="alert-head">
      <span>PRECAUCIÓN</span>
      <span class="alert-go">Ir →</span>
    </div>
    <div class="alert-body">${alertValue(alertObj)}</div>
    <i class="alert-bar"></i>
  `);
}

function triggerRedAlert(alertObj) {
  activeAlertTarget = alertObj;
  showAlert("red", `
    <button type="button" class="alert-x" data-alert-close="red" aria-label="Descartar aviso"><span class="icon-close" aria-hidden="true"></span></button>
    <div class="alert-head">
      <span>[ ! ] ALERTA CRÍTICA</span>
      <span class="alert-go">Ir →</span>
    </div>
    <div class="alert-body">${alertValue(alertObj)}</div>
    <i class="alert-bar"></i>
  `);
}

/* Un solo listener: cerrar aviso, ir a la zona y botón "Cerrar" del diálogo */
document.addEventListener("click", e => {
  const close = e.target.closest("[data-alert-close]");
  if (close) {
    e.stopPropagation();
    hideAlert(close.dataset.alertClose);
    return;
  }

    const toastEl = e.target.closest("#alert-toast-yellow, #alert-toast-red, #alert-toast-vital");
  if (toastEl && activeAlertTarget) {
    const t = activeAlertTarget;
    hideAlert("yellow");
    hideAlert("red");
    hideAlert("vital");
    activeAlertTarget = null;
    if (t.cr) S.crew = t.cr.id;
    Nav.go({ tab: t.z.tab, z: t.z.id, p: t.r.p.id });
    return;
  }

  if (e.target.closest("[data-dlg-close]")) dlg.close();
});

/* Pausa la cuenta regresiva mientras el cursor o el foco están sobre el aviso */
["yellow", "red"].forEach(kind => {
  const el = alertEls()[kind];
  if (!el) return;
  const pause = () => {
    clearTimeout(alertTimers[kind]);
    el.classList.add("paused");
  };
  const resume = () => {
    if (!el.classList.contains("on")) return;
    el.classList.remove("paused");
    alertTimers[kind] = setTimeout(() => hideAlert(kind), 2000);
  };
  el.addEventListener("mouseenter", pause);
  el.addEventListener("mouseleave", resume);
  el.addEventListener("focusin", pause);
  el.addEventListener("focusout", resume);
});

addEventListener("keydown", e => {
  if (e.key === "Escape") {
    hideAlert("red");
    hideAlert("yellow");
  }
});

  <script>
/* nav.js — enrutador por hash, ciclo de vida de vistas (v-if), menú jerárquico y drawer. Se carga después de apps.js. */
"use strict";

/* Vistas: solo la activa existe en el DOM; al cambiar de pestaña la anterior se desmonta. */
const VIEWS = {

/* Árbol del menú. Hoja: n=texto, z=zona, p=parámetro, a=ancla, x=estado extra. Las zonas no listadas se agregan solas. */
