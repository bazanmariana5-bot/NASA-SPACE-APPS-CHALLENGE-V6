<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060912">
  <script>
    /* Aplica el tema antes del primer dibujado (evita el destello): elección guardada, o la del sistema. */
    (function () {
      var t = "dark";
      try {
        var v = localStorage.getItem("ks-theme");
        t = v === "light" || v === "dark" ? v : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "light" ? "#eef2fa" : "#060912");
    })();
  </script>
  <title>Kinesoft: Asistente Médico de Tripulación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* css/base.css — Variables de diseño, reinicio y tipografía. */

:root {
  /* ---- Tema oscuro (predeterminado) ---- */
  --bg: #060912;
  --glass: rgba(16, 24, 44, .62);
  --line: rgba(140, 180, 255, .16);
  --tx: #e8eefc;
  --mu: #8d9bb8;
  --ac: #7fb2ff;
  --ok: #2ee6a6;
  --warn: #ffb547;
  --bad: #ff6b6b;
  --s3: #6d788f;

  --on-ac: #06101f;          /* texto sobre el color de acento */
  --on-ok: #042;             /* texto sobre fondo --ok */
  --ac-rgb: 127, 178, 255;   /* acento en RGB, para fondos translúcidos */
  --fig-rgb: 190, 215, 255;  /* trazos de la figura anatómica */
  --edge-rgb: 5, 8, 18;      /* contornos de zonas */

  --surf: rgba(10, 16, 32, .78);   /* tarjetas */
  --field: rgba(5, 8, 18, .7);     /* campos de formulario */
  --solid: #0a1020;                /* diálogos */
  --drawer: rgba(8, 12, 26, .95);  /* menú lateral y tooltip */
  --scrim: rgba(0, 0, 0, .55);
  --scrim-dlg: rgba(0, 0, 0, .7);
  --hov: rgba(255, 255, 255, .08);
  --bx: #10192e;                   /* caja de las pruebas */
  --toast-bad: #1a0f1a;

  --sky-1: rgba(90, 70, 200, .28);
  --sky-2: rgba(20, 120, 170, .22);
  --star-1: #fff;
  --star-2: #cfe0ff;
  --star-op: 1;

  --sil: #9ec5ff;
  --sil-fill: #0a1128;
  --sel: #fff;               /* resalte de selección y puntos reales */
  --grid: #8cb4ff;           /* rejilla de los gráficos */

  --cw1: #7fb2ff;            /* colores de tripulantes */
  --cw2: #ff8ad8;
  --cw3: #ffd23f;

  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---- Tema claro ---- */
:root[data-theme="light"] {
  --bg: #eef2fa;
  --glass: rgba(255, 255, 255, .74);
  --line: rgba(30, 60, 120, .18);
  --tx: #0f1a33;
  --mu: #55627d;
  --ac: #2a5fd1;
  --ok: #0a8f65;
  --warn: #b36b00;
  --bad: #d12f45;
  --s3: #7b869e;

  --on-ac: #fff;
  --on-ok: #fff;
  --ac-rgb: 42, 95, 209;
  --fig-rgb: 40, 70, 130;
  --edge-rgb: 255, 255, 255;

  --surf: rgba(255, 255, 255, .8);
  --field: rgba(255, 255, 255, .9);
  --solid: #fff;
  --drawer: rgba(255, 255, 255, .97);
  --scrim: rgba(15, 26, 51, .35);
  --scrim-dlg: rgba(15, 26, 51, .5);
  --hov: rgba(15, 26, 51, .07);
  --bx: #dfe7f6;
  --toast-bad: #fff0f2;

  --sky-1: rgba(90, 70, 200, .12);
  --sky-2: rgba(20, 120, 170, .1);
  --star-1: #3d5aa0;
  --star-2: #5a74b8;
  --star-op: .35;

  --sil: #3d6bc4;
  --sil-fill: #d6e1f5;
  --sel: #0f1a33;
  --grid: #28468c;

  --cw1: #2a5fd1;
  --cw2: #c2288f;
  --cw3: #a87400;

  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 400 15px/1.5 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
}

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}


/* css/layout.css — Fondo, encabezado, controles, botones, drawer, héroe y pestañas. */

.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(60% 50% at 80% 10%, var(--sky-1), transparent),
              radial-gradient(50% 40% at 10% 90%, var(--sky-2), transparent);
}

.sky i {
  position: absolute;
  inset: -260px 0 0;
  background-image: radial-gradient(1.5px 1.5px at 20px 30px, var(--star-1), transparent),
                    radial-gradient(1px 1px at 90px 80px, var(--star-2), transparent),
                    radial-gradient(1.2px 1.2px at 150px 140px, var(--star-1), transparent);
  background-size: 180px 180px;
  opacity: calc(.55 * var(--star-op));
  animation: drift 90s linear infinite;
}

.sky i + i {
  background-size: 260px 260px;
  opacity: calc(.35 * var(--star-op));
  animation-duration: 150s;
}

@keyframes drift {
  to {
    transform: translateY(260px);
  }
}

.g {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 10px 14px;
  margin: 8px;
  border-radius: 16px;
}

header h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 700;
  flex: 1;
  min-width: 140px;
}

.ctl {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--mu);
}

select,
input,
textarea {
  background: var(--field);
  color: var(--tx);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
  font-size: 14px;
  min-width: 0;
}

select:focus,
input:focus,
textarea:focus,
button:focus-visible,
summary:focus-visible,
.z:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}

input[type=range] {
  padding: 0;
  accent-color: var(--ac);
  width: 130px;
}

button {
  font: inherit;
  color: var(--tx);
  cursor: pointer;
}

.btn {
  background: var(--ac);
  color: var(--on-ac);
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 700;
}

.btn.o {
  background: transparent;
  color: var(--tx);
  border: 1px solid var(--line);
}

.btn.sm {
  padding: 5px 10px;
  font-size: 13px;
}

.ib {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 18px;
}

/* Botón de tema: muestra el ícono de lo que se activará al tocarlo (sol en oscuro, luna en claro). */
#theme {
  display: inline-grid;
  place-items: center;
  padding: 0;
}

#theme .ic { display: block; }
:root[data-theme="light"] #theme .ic-sun,
:root:not([data-theme="light"]) #theme .ic-moon { display: none; }

.app {
  position: relative;
  z-index: 1;
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 8px 40px;
  display: grid;
  gap: 12px;
}

#drawer {
  position: fixed;
  z-index: 40;
  inset: 0 auto 0 0;
  width: 340px;
  max-width: 90vw;
  overscroll-behavior: contain;
  transform: translateX(-105%);
  transition: transform .3s;
  padding: 16px;
  border-radius: 0 18px 18px 0;
  background: var(--drawer);
  overflow: auto;
}

#drawer.open {
  transform: none;
}

#scrim {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: var(--scrim);
  display: none;
}

#scrim.on {
  display: block;
}

.crew {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 14px;
  background: transparent;
  border: 1px solid var(--line);
}

.crew.on {
  background: rgba(var(--ac-rgb), .14);
  border-color: var(--ac);
}

.crew b {
  display: block;
  font-size: 14px;
}

.crew span {
  font-size: 12px;
  color: var(--mu);
}

.av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #2b4fa8, #6a4fd8);
  font-weight: 700;
  flex: none;
}

.hero {
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
}

.hero h2 {
  margin: 4px 0 2px;
  font-size: 24px;
}

.hero p {
  margin: 0;
  color: var(--mu);
  font-size: 13px;
}

.kp {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.kp div {
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  text-align: center;
}

.kp small {
  display: block;
  color: var(--mu);
  font-size: 11px;
}

.kp b {
  font-size: 20px;
}

.bd {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid currentColor;
  font-weight: 500;
}

.bd::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.t0 { color: var(--ok); }
.t1 { color: var(--warn); }
.t2 { color: var(--bad); }
.t3 { color: var(--s3); }

.rail {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.rail::-webkit-scrollbar {
  display: none;
}

.rail > * {
  scroll-snap-align: start;
  flex: none;
}

.rw {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rw .rail {
  flex: 1;
}

.rw .ib {
  display: none;
}

@media (min-width: 900px) {
  .rw .ib {
    display: block;
  }
}

.tab {
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: transparent;
  font-weight: 500;
  white-space: nowrap;
}

.tab.on {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
}

.stage {
  display: grid;
  gap: 12px;
}

.stage.anim > * {
  animation: in .4s ease;
}

@keyframes in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

.pn {
  padding: 16px;
}

.svgw {
  display: grid;
  place-items: center;
  border-radius: 14px;
  min-height: 380px;
  position: relative;
}

/* ---- Selector de idioma ES | EN ----
   Control propio con los mismos tokens que el resto de la cabecera; maneja el
   widget de Google Translate, que queda oculto. */
#google_translate_element {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.lang {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.lang svg {
  margin: 0 4px 0 6px;
  color: var(--mu);
  flex: none;
}

.lang button {
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--mu);
  transition: background .15s, color .15s;
}

.lang button:hover {
  background: var(--hov);
  color: var(--tx);
}

.lang button[aria-pressed="true"] {
  background: var(--ac);
  color: var(--on-ac);
}

/* Oculta la barra y los resaltes que Google Translate inyecta en la página. */
body { top: 0 !important; }
.skiptranslate:not(#google_translate_element):not(.lang),
iframe.skiptranslate,
.goog-te-banner-frame,
#goog-gt-tt,
.goog-tooltip { display: none !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }


/* css/anatomy.css — Figura anatómica SVG y estados por zona. */

svg.body {
  width: 100%;
  max-width: 270px;
  height: auto;
}

.sil-a * {
  fill: none;
  stroke: var(--sil);
  stroke-opacity: .6;
  stroke-width: 3;
  stroke-linejoin: round;
}

.sil-b * {
  fill: var(--sil-fill);
  stroke: none;
}

.sil-c * {
  fill: url(#bs);
  fill-opacity: .26;
  stroke: none;
}

.gh {
  pointer-events: none;
}

.gh .f {
  fill: rgba(var(--fig-rgb), .07);
  stroke: rgba(var(--fig-rgb), .2);
  stroke-width: .6;
}

.gh .s {
  fill: none;
  stroke: rgba(var(--fig-rgb), .18);
}

.gh .d,
.gh .k {
  fill: none;
  stroke: none;
}

.rings circle {
  fill: none;
  stroke: rgba(var(--ac-rgb), .14);
  stroke-dasharray: 2 5;
}

.scan {
  fill: rgba(var(--ac-rgb), .35);
  animation: scan 5s linear infinite;
}

@keyframes scan {
  from { transform: translateY(0); }
  to { transform: translateY(470px); }
}

.z {
  cursor: pointer;
  transition: color .4s, filter .4s;
}

.z .f {
  fill: currentColor;
  fill-opacity: .62;
  stroke: rgba(var(--edge-rgb), .55);
  stroke-width: .7;
}

.z .s {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-opacity: .9;
}

.z .d {
  fill: none;
  stroke: rgba(var(--edge-rgb), .6);
  stroke-width: .9;
  stroke-linecap: round;
  pointer-events: none;
}

.z .k {
  fill: var(--bg);
  fill-opacity: .85;
  pointer-events: none;
}

.z.s0 { color: var(--ok); filter: drop-shadow(0 0 3px rgba(46, 230, 166, .6)); }
.z.s1 { color: var(--warn); filter: drop-shadow(0 0 3px rgba(255, 181, 71, .7)); }
.z.s2 { color: var(--bad); filter: drop-shadow(0 0 4px rgba(255, 107, 107, .85)); }
.z.s3 { color: var(--s3); filter: none; }

.z.sel .f {
  stroke: var(--sel);
  stroke-width: 1.2;
  fill-opacity: .88;
}

.z.sel {
  filter: drop-shadow(0 0 2px var(--sel)) drop-shadow(0 0 7px currentColor);
}

.z:hover {
  opacity: .82;
}

#tip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 12px;
  background: var(--drawer);
  border: 1px solid var(--line);
  display: none;
  white-space: nowrap;
}


/* css/components.css — Tarjetas, barras, leyendas, formularios, diálogo y toast. */

.card {
  width: 240px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  text-align: left;
  display: block;
}

.card.sel {
  border-color: var(--ac);
  box-shadow: 0 0 0 1px var(--ac);
}

.card small {
  color: var(--mu);
}

.card .v {
  font-size: 24px;
  font-weight: 700;
  margin: 4px 0;
}

.card .v em {
  font-style: normal;
  font-size: 12px;
  color: var(--mu);
  font-weight: 400;
}

.bar {
  height: 6px;
  border-radius: 9px;
  background: var(--hov);
  overflow: hidden;
  margin: 8px 0;
}

.bar i {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: currentColor;
  transition: width .5s;
}

.src {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 6px;
  background: rgba(var(--ac-rgb), .15);
  color: var(--ac);
  font-style: normal;
}

.src.r {
  background: var(--ac);
  color: var(--on-ac);
  font-weight: 700;
}

details {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  margin-top: 8px;
}

summary {
  cursor: pointer;
  color: var(--ac);
  font-size: 13px;
}

details p {
  color: var(--mu);
  font-size: 13px;
  margin: 6px 0;
}

.lg {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--mu);
  margin-top: 4px;
}

.pl {
  display: grid;
  gap: 6px;
  margin: 8px 0;
}

.pr {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 13px;
}

.pr.on {
  border-color: var(--ac);
  background: rgba(var(--ac-rgb), .1);
}

.pr > span:last-child {
  grid-column: 1 / -1;
}

.pr em {
  font-style: normal;
  font-size: 11px;
  color: var(--mu);
}

.two {
  display: grid;
  gap: 12px;
}

@media (min-width: 900px) {
  .two.fig {
    grid-template-columns: 320px 1fr;
  }
}

@media (max-width: 899px) {
  .xs {
    display: none;
  }
}

dialog {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--solid);
  color: var(--tx);
  padding: 18px;
  width: min(620px, 94vw);
  max-height: 92vh;
}

dialog::backdrop {
  background: var(--scrim-dlg);
}

.fg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.fg label {
  font-size: 12px;
  color: var(--mu);
  display: grid;
  gap: 4px;
}

.w {
  grid-column: 1 / -1;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 13px;
}

.chip.on {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
}

.sw {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.sw button {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 2px solid transparent;
  font-weight: 700;
  color: #06101f;
}

.big {
  min-height: 170px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  user-select: none;
  touch-action: manipulation;
  padding: 12px;
}

table.tb {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.tb td,
.tb th {
  padding: 6px 8px;
  border-top: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.tb th {
  color: var(--mu);
  font-weight: 500;
}

.alert {
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid currentColor;
  margin: 8px 0;
  font-size: 13px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ok);
  color: var(--on-ok);
  padding: 8px 16px;
  border-radius: 99px;
  font-weight: 700;
  opacity: 0;
  transition: opacity .3s;
  z-index: 70;
  pointer-events: none;
}

#toast.on {
  opacity: 1;
}

a {
  color: var(--ac);
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- Íconos dibujados en CSS (sin caracteres especiales) ---------- */
.icon-menu {
  display: inline-block;
  width: 18px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  box-shadow: 0 -6px 0 currentColor, 0 6px 0 currentColor;
  vertical-align: middle;
}

.icon-close {
  position: relative;
  display: inline-block;
  width: 14px;
  height: 14px;
  vertical-align: middle;
}

.icon-close::before,
.icon-close::after {
  content: "";
  position: absolute;
  top: 6px;
  left: -1px;
  width: 16px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
}

.icon-close::before { transform: rotate(45deg); }
.icon-close::after { transform: rotate(-45deg); }

/* css/panel.css — Panel: selector de tripulante y cuadrícula de gráficos. */

/* ==========================================================================
   PANEL: SELECTOR DE TRIPULANTE Y CUADRÍCULA DE GRÁFICOS
   ========================================================================== */

.ccw {
  display: grid;
  gap: 10px;
  margin-top: 12px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

.cc {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  position: relative;
  overflow: hidden;
}

.cc::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--cc);
}

.cc.on {
  border-color: var(--cc);
  background: rgba(var(--ac-rgb), .1);
  box-shadow: 0 0 0 1px var(--cc);
}

.cc .av {
  width: 44px;
  height: 44px;
  font-size: 18px;
}

.ci {
  flex: 1;
  min-width: 0;
}

.ci b {
  display: block;
  font-size: 14px;
}

.ci > span {
  font-size: 12px;
  color: var(--mu);
}

.mini {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.mini i {
  font-style: normal;
  font-size: 11px;
}

.cg {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

.gc {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: grid;
  gap: 6px;
  align-content: start;
  transition: border-color .2s;
}

.gc:hover,
.gc:focus-visible {
  border-color: var(--ac);
}

.gc header small {
  display: block;
  color: var(--mu);
  font-size: 12px;
}

.gc header b {
  font-size: 15px;
}

.gv {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.gv .mono {
  font-size: 26px;
  font-weight: 500;
}

.gv em {
  font-style: normal;
  font-size: 12px;
  color: var(--mu);
}

.gv .bd {
  margin-left: auto;
}

.gc footer {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--mu);
  flex-wrap: wrap;
}


/* css/registro.css — Registro por zona. */

/* ==========================================================================
   REGISTRO POR ZONA
   ========================================================================== */

.rf {
  display: block;
  font-size: 11px;
  color: var(--mu);
  margin-top: 2px;
}

.rf .bd {
  font-size: 10px;
  padding: 0 7px;
}

.zc {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}

.zc i {
  font-style: normal;
}

.tb tr.cur td {
  background: rgba(var(--ac-rgb), .1);
}

.tb .chip {
  padding: 2px 10px;
  font-size: 12px;
}

#regform .fg label {
  align-content: start;
}

@media (max-width: 560px) {
  .fg {
    grid-template-columns: 1fr;
  }
  .cg {
    grid-template-columns: 1fr;
  }
}

.app > *,
.main > *,
.rw .rail {
  min-width: 0;
}

.main {
  min-width: 0;
}

.gc,
.cc {
  min-width: 0;
}

.two > * {
  min-width: 0;
}

@media (min-width: 900px) {
  .two.fig {
    grid-template-columns: 320px minmax(0, 1fr);
  }
}

.stage,
.main {
  grid-template-columns: minmax(0, 1fr);
}

.stage > * {
  min-width: 0;
}


/* css/views.css — Vistas, drawer jerárquico y navegación. */

/* ==========================================================================
   VISTAS (V-IF), DRAWER JERÁRQUICO Y NAVEGACIÓN
   ========================================================================== */

.view {
  display: grid;
  gap: 12px;
  min-width: 0;
}

.view [id],
#insp,
#regform {
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px);
}

html.lock {
  overflow: hidden;
}

#drawer[inert] {
  visibility: hidden;
  transition: transform .3s, visibility 0s .3s;
}

.dh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.dh b {
  color: var(--mu);
  font-size: 12px;
  letter-spacing: .08em;
}

.sec {
  color: var(--mu);
  font-size: 12px;
  margin: 14px 0 8px;
  letter-spacing: .08em;
}

#nav {
  display: grid;
  gap: 6px;
}

.ng {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}

.ng.cur {
  border-color: var(--ac);
}

.ngh {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  text-align: left;
}

.ngh b {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
}

.ngh em {
  font-style: normal;
  color: var(--mu);
  transition: transform .2s;
}

.ng.open .ngh em {

}

.ng ul {
  list-style: none;
  margin: 0;
  padding: 0 6px 6px;
  display: none;
}

.ng.open ul {

}

.nl {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 42px;
  padding: 8px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  font-size: 13px;
}

.nl:hover {
  background: rgba(var(--ac-rgb), .08);
}

.nl.on {
  background: rgba(var(--ac-rgb), .18);

}

.nl i,
.ngh i {

  font-size: 10px;
}

/* Gráficos de evolución junto a la silueta e historial */
.pn svg[role="img"] {

  margin-inline: auto;
}

@media (max-width: 560px) {
  .pn svg[role="img"] {
    max-width: 100%;
  }
}

.view {
  grid-template-columns: minmax(0, 1fr);
}

.view > * {

}

@media (min-width: 900px) {

    width: calc((100% - 30px) / 4);
  }
}

.ib[data-r="cards"] {
  display: block;
}


/* css/plan.css — Pestaña Plan de ejercicio y vista lateral del cuello. */

.plg {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-rows: 1fr;

}

.card.plc {

.plb {

.plc h3 {

.plc ol,

.plc .bd {

.vsf {

/* Vista lateral del cuello (capa de músculos) */
.neckz {

svg.body.neck {

}

svg.neck text {

  fill: var(--mu);
}


/* css/alerts.css — Alertas: precaución (aviso grande), crítica (panel central) y emergencia vital (pantalla completa). */

/* ---------- Velo que oscurece la pantalla detrás de las alertas grandes ---------- */
#alert-veil {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
}
#alert-veil[data-level="red"] { opacity: 1; background: radial-gradient(70% 60% at 50% 50%, rgba(0,0,0,.35), rgba(60,0,10,.62)); }
#alert-veil[data-level="vital"] { opacity: 1; background: radial-gradient(60% 55% at 50% 50%, rgba(40,0,6,.55), rgba(20,0,3,.9)); animation: veilPulse 1s ease-in-out infinite; }
@keyframes veilPulse { 50% { filter: brightness(1.35) saturate(1.3); } }

/* Marco rojo que late en los bordes durante la emergencia */
#alert-veil[data-level="vital"]::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 4px rgba(255,60,70,.9), inset 0 0 120px 20px rgba(255,40,60,.55);
  animation: edgeBlink .9s steps(2, jump-none) infinite;
}
@keyframes edgeBlink { 0% { opacity: .35; } 100% { opacity: 1; } }

html.vital-open body { overflow: hidden; }

/* ---------- Base común de los avisos ---------- */
#alert-toast-yellow,
#alert-toast-red,
#alert-toast-vital {
  position: fixed;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  --alert-ms: 8000ms;
}
#alert-toast-yellow.on,
#alert-toast-red.on,
#alert-toast-vital.on { opacity: 1; pointer-events: auto; }

.alert-ico { width: 100%; height: 100%; display: block; }
.alert-ico .tri { fill: currentColor; }
.alert-ico .ex { fill: var(--alert-ex, #1b1000); }

.alert-x {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.08);
  color: inherit;
  transition: transform .2s, background .2s;
}
.alert-x:hover { background: rgba(255,255,255,.2); transform: rotate(90deg) scale(1.08); }

.alert-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 4px;
  width: 100%;
  background: currentColor;
  transform-origin: left;
  opacity: .8;
}
.on:not(.paused) > .alert-bar { animation: alertCount var(--alert-ms) linear forwards; }
.on.paused > .alert-bar { animation-play-state: paused; }
@keyframes alertCount { to { transform: scaleX(0); } }

.alert-val { font-size: 1.15em; font-weight: 700; }
.alert-val small { font-size: .7em; opacity: .8; font-weight: 400; }

.vital-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid currentColor;
  opacity: 0;
  animation: ringOut 1.6s ease-out infinite;
}
.vital-ring.r2 { animation-delay: .8s; }
@keyframes ringOut { 0% { transform: scale(.8); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }

/* ---------- Precaución: aviso grande arriba a la derecha ---------- */
#alert-toast-yellow {
  z-index: 100;
  top: calc(84px + env(safe-area-inset-top, 0px));
  right: 20px;
  width: min(440px, calc(100vw - 32px));
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 18px 20px 20px;
  border-radius: 18px;
  cursor: pointer;
  color: #2a1700;
  background: linear-gradient(135deg, #ffd166, #ffab2e);
  border: 2px solid #fff3c9;
  box-shadow: 0 0 0 0 rgba(255,181,71,.6), 0 18px 50px rgba(0,0,0,.5);
  transform: translateX(120%);
  transition: transform .45s cubic-bezier(.2,1.2,.3,1), opacity .3s;
  --alert-ex: #ffcf6b;
}
#alert-toast-yellow.on { transform: none; animation: warnGlow 1.8s ease-in-out infinite .45s; }
#alert-toast-yellow:hover { filter: brightness(1.05); }
@keyframes warnGlow { 50% { box-shadow: 0 0 0 10px rgba(255,181,71,0), 0 18px 50px rgba(0,0,0,.5), 0 0 34px rgba(255,181,71,.65); } }
#alert-toast-yellow .alert-emblem { width: 58px; height: 58px; flex: none; color: #2a1700; animation: tilt 1.6s ease-in-out infinite; }
@keyframes tilt { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.08); } }
#alert-toast-yellow .alert-main { flex: 1; min-width: 0; }
#alert-toast-yellow .alert-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
#alert-toast-yellow .alert-kicker { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
#alert-toast-yellow .alert-go { font-size: 12px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
#alert-toast-yellow .alert-info { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; align-items: baseline; }
#alert-toast-yellow .alert-zone { font-weight: 700; }
#alert-toast-yellow .alert-bar { color: #2a1700; }

/* ---------- Crítica: panel grande centrado ---------- */
#alert-toast-red {
  z-index: 110;
  top: 50%;
  left: 50%;
  width: min(620px, calc(100vw - 28px));
  padding: 28px 28px 32px;
  border-radius: 24px;
  color: #fff;
  background: linear-gradient(160deg, #4a0b16 0%, #1b0409 100%);
  border: 2px solid #ff5c6c;
  box-shadow: 0 0 0 0 rgba(255,60,80,.7), 0 30px 90px rgba(0,0,0,.65);
  transform: translate(-50%, -46%) scale(.86);
  transition: transform .4s cubic-bezier(.2,1.3,.3,1), opacity .25s;
}
#alert-toast-red.on { transform: translate(-50%, -50%) scale(1); animation: critGlow 1.2s ease-in-out infinite .4s; }
@keyframes critGlow { 50% { box-shadow: 0 0 0 12px rgba(255,60,80,0), 0 30px 90px rgba(0,0,0,.65), 0 0 60px rgba(255,60,80,.6); } }
#alert-toast-red .alert-row { display: flex; gap: 22px; align-items: center; }
#alert-toast-red .alert-emblem { position: relative; width: 92px; height: 92px; flex: none; color: #ff5c6c; --alert-ex: #2a0409; animation: tilt 1.2s ease-in-out infinite; }
#alert-toast-red .alert-kicker { font-size: 14px; font-weight: 700; color: #ff9aa5; letter-spacing: .08em; text-transform: uppercase; }
#alert-toast-red .alert-title { margin: 2px 0 8px; font: 700 clamp(24px, 4.4vw, 34px)/1.1 'Sora', 'Space Grotesk', sans-serif; padding-right: 36px; }
#alert-toast-red .alert-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 18px; align-items: baseline; }
#alert-toast-red .alert-val { color: #ff8a97; font-size: 28px; }
#alert-toast-red .alert-hint { margin: 10px 0 0; font-size: 14px; color: rgba(255,255,255,.78); max-width: 46ch; }
#alert-toast-red .alert-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
#alert-toast-red .btn { background: #ff5c6c; color: #2a0409; }
#alert-toast-red .btn.o { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
#alert-toast-red .alert-bar { color: #ff5c6c; height: 5px; }

/* ---------- Emergencia vital: pantalla completa ---------- */
#alert-toast-vital {
  z-index: 120;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  overflow: auto;
  transition: opacity .3s;
  color: #fff;
}
.vital-card {
  position: relative;
  width: min(760px, 100%);
  padding: clamp(22px, 4vw, 40px);
  border-radius: 28px;
  background: linear-gradient(165deg, #55060f 0%, #1c0307 70%);
  border: 3px solid #ff3b4d;
  box-shadow: 0 0 80px rgba(255,40,60,.65), 0 30px 120px rgba(0,0,0,.8);
  outline: none;
  transform: scale(.9);
  animation: vitalIn .5s cubic-bezier(.2,1.3,.3,1) forwards;
}
@keyframes vitalIn { to { transform: scale(1); } }
.vital-row { display: flex; gap: clamp(16px, 3vw, 32px); align-items: center; }
.vital-emblem { position: relative; width: clamp(96px, 20vw, 168px); aspect-ratio: 1; flex: none; display: grid; place-items: center; color: #ff3b4d; --alert-ex: #2a0409; }
.vital-emblem .alert-ico { color: #ff3b4d; }
.vital-heart-svg { width: 100%; height: 100%; display: block; fill: #ff3b4d; filter: drop-shadow(0 0 18px rgba(255,59,77,.9)); transform-origin: 50% 55%; animation: heartbeat .62s ease-in-out infinite; }
.vital-heart-svg .ex { fill: #fff; }
@keyframes heartbeat {
  0%   { transform: scale(1); }
  14%  { transform: scale(1.22); }
  28%  { transform: scale(1); }
  42%  { transform: scale(1.16); }
  70%,100% { transform: scale(1); }
}
.vital-text { min-width: 0; padding-right: 30px; }
.vital-kicker { font-size: 13px; font-weight: 700; color: #ff9aa5; letter-spacing: .12em; text-transform: uppercase; animation: kBlink 1s steps(2, jump-none) infinite; }
@keyframes kBlink { 0% { opacity: .35; } 100% { opacity: 1; } }
.vital-title { margin: 4px 0 8px; font: 700 clamp(26px, 5.2vw, 46px)/1.05 'Sora', 'Space Grotesk', sans-serif; text-wrap: balance; }
.vital-who { margin: 0; font-size: clamp(16px, 2.4vw, 21px); line-height: 1.35; }
.vital-who b { color: #ffb3bb; }
.vital-note { margin: 18px 0 0; font-size: 15px; color: rgba(255,255,255,.82); }

.vital-defib {
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 16px;
  background: #ffe14d;
  color: #2a1d00;
  border: 2px dashed #2a1d00;
  animation: defibFlash .9s steps(2, jump-none) infinite;
}
@keyframes defibFlash { 0% { background: #ffe14d; } 100% { background: #ffc400; } }
#alert-toast-vital.charged .vital-defib { animation-duration: .35s; }
.defib-text { display: grid; gap: 2px; }
.defib-text b { font: 700 clamp(22px, 4vw, 32px)/1.05 'Sora', 'Space Grotesk', sans-serif; }
.defib-text span { font-size: 15px; font-weight: 500; }
.defib-charge { margin-top: 12px; height: 12px; border-radius: 9px; background: rgba(42,29,0,.22); overflow: hidden; }
.defib-charge i { display: block; height: 100%; background: #2a1d00; transform-origin: left; transform: scaleX(0); animation: charge 8s linear forwards; }
@keyframes charge { to { transform: scaleX(1); } }

.vital-meta { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,.7); }
.vital-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.vital-actions .btn { background: #fff; color: #4a0610; }
.vital-actions .btn.o { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.vital-card .alert-x { top: 16px; right: 16px; }

@media (max-width: 560px) {
  #alert-toast-red .alert-row, .vital-row { flex-direction: column; text-align: center; }
  .vital-text { padding-right: 0; }
  #alert-toast-red .alert-title { padding-right: 0; }
  #alert-toast-red .alert-emblem { width: 72px; height: 72px; }
}

@media (prefers-reduced-motion: reduce) {
  .vital-ring { display: none; }
  #alert-veil[data-level="vital"]::after { animation: none; }
}

/* css/space.css — Escena espacial animada, astronauta y capa de interacción (botones, tarjetas).
   Se carga al final para ajustar los componentes sin tocar sus archivos. */

:root {
  --font-display: 'Sora', 'Space Grotesk', system-ui, sans-serif;
  --ease-pop: cubic-bezier(.2, 1.2, .3, 1);
}

/* ---------- Formas dibujadas en CSS (leyendas y chips) ---------- */
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: baseline; flex: none; }
.ln { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: currentColor; margin-right: 6px; vertical-align: middle; }
.ln.dsh { background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 9px); }
.ln.vrt { width: 3px; height: 14px; }
.u-c-fff { color: var(--sel) !important; }
.nl .dot { margin: 0 0 0 auto; }

/* ---------- Escena de fondo ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: linear-gradient(180deg, var(--scene-top) 0%, var(--scene-bot) 100%); }
:root { --scene-top: #03050d; --scene-bot: #0a1024; --neb-a: rgba(112, 82, 230, .34); --neb-b: rgba(24, 148, 205, .26); --neb-c: rgba(230, 80, 160, .16); --earth-a: #1d5fd0; --earth-b: #0a2a6e; --astro-op: .9; }
:root[data-theme="light"] { --scene-top: #dfe8fb; --scene-bot: #f4f7fe; --neb-a: rgba(112, 82, 230, .14); --neb-b: rgba(24, 148, 205, .14); --neb-c: rgba(230, 80, 160, .08); --earth-a: #7aa7ee; --earth-b: #b9d0f6; --astro-op: .8; }

.scene .neb { position: absolute; inset: -20%; filter: blur(40px); animation: nebDrift 70s ease-in-out infinite alternate;
  background: radial-gradient(38% 32% at 24% 28%, var(--neb-a), transparent 70%), radial-gradient(34% 30% at 78% 20%, var(--neb-b), transparent 70%), radial-gradient(30% 26% at 62% 78%, var(--neb-c), transparent 70%); }
@keyframes nebDrift { to { transform: translate3d(-4%, 3%, 0) rotate(4deg) scale(1.08); } }

.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: var(--star-op); }

/* Limbo de la Tierra al pie de la pantalla */
.scene .earth { position: absolute; left: 50%; bottom: -118vmin; width: 150vmin; aspect-ratio: 1; margin-left: -75vmin; border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, var(--earth-a), var(--earth-b) 42%, transparent 70%);
  box-shadow: 0 -2px 60px 6px rgba(120, 180, 255, .45), inset 0 14px 40px rgba(170, 215, 255, .6); opacity: .85; animation: earthBreath 12s ease-in-out infinite alternate; }
@keyframes earthBreath { to { box-shadow: 0 -2px 90px 12px rgba(120, 180, 255, .6), inset 0 18px 50px rgba(170, 215, 255, .75); } }

/* Astronauta flotando de fondo */
.scene .astro { position: absolute; right: clamp(-60px, 4vw, 90px); bottom: 7vh; width: clamp(180px, 26vw, 400px); opacity: var(--astro-op); animation: astroFloat 14s ease-in-out infinite; transform-origin: 50% 50%; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .45)); }
.scene .astro svg { width: 100%; height: auto; display: block; overflow: visible; }
@keyframes astroFloat {
  0%   { transform: translate3d(0, 0, 0) rotate(-8deg); }
  50%  { transform: translate3d(-18px, -34px, 0) rotate(5deg); }
  100% { transform: translate3d(0, 0, 0) rotate(-8deg); }
}
.astro .arm-l { transform-origin: 82px 148px; animation: wave 6s ease-in-out infinite; }
.astro .tether { stroke-dasharray: 2 7; animation: tether 4s linear infinite; }
.astro .glint { animation: glint 7s ease-in-out infinite; }
@keyframes wave { 50% { transform: rotate(-9deg); } }
@keyframes tether { to { stroke-dashoffset: -18; } }
@keyframes glint { 0%, 70%, 100% { opacity: .25; } 80% { opacity: .9; } }

/* ---------- Tipografía y encabezado ---------- */
body > header h1, .hero h2 { font-family: var(--font-display); letter-spacing: -.01em; }
body > header h1 { font-size: 17px; }
.hero h2 { font-size: 28px; }

body > header { margin: 10px auto 8px; width: calc(100% - 16px); max-width: 1320px; border-color: rgba(var(--ac-rgb), .28); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }

/* ---------- Superficies de vidrio ---------- */
.g { box-shadow: 0 12px 40px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .06); }
:root[data-theme="light"] .g { box-shadow: 0 10px 34px rgba(30, 60, 120, .12), inset 0 1px 0 rgba(255, 255, 255, .8); }

/* ---------- Guía didáctica ---------- */
.guide { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 16px; font-size: 13px; color: var(--mu); }
.guide b { color: var(--tx); font-weight: 600; }
.guide .gi { display: inline-flex; align-items: center; gap: 8px; }
.guide .dot { margin: 0; width: 11px; height: 11px; }

/* ---------- Interacción: botones ---------- */
.btn, .tab, .ib, .chip, .pr, .nl, .lang button, select {
  transition: transform .22s var(--ease-pop), box-shadow .22s, background-color .2s, border-color .2s, color .2s, filter .2s;
}
.btn { position: relative; overflow: hidden; }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .6s ease; pointer-events: none; }
@media (hover: hover) {
  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 8px 22px rgba(var(--ac-rgb), .45); }
  .btn:hover::after { transform: translateX(120%); }
  .btn.o:hover { background: rgba(var(--ac-rgb), .14); border-color: var(--ac); box-shadow: 0 8px 22px rgba(var(--ac-rgb), .25); }
  .tab:hover { transform: translateY(-2px); border-color: var(--ac); background: rgba(var(--ac-rgb), .12); }
  .tab.on:hover { background: var(--ac); filter: brightness(1.1); }
  .ib:hover { transform: scale(1.1) rotate(-4deg); border-color: var(--ac); background: rgba(var(--ac-rgb), .14); }
  .chip:hover, .pr:hover { transform: translateY(-2px); border-color: var(--ac); }
  .nl:hover { transform: translateX(4px); }
  select:hover { border-color: var(--ac); }
}
.btn:active, .tab:active, .ib:active, .chip:active { transform: scale(.96); }

/* ---------- Interacción: las tarjetas se agrandan ---------- */
.card, .gc, .cc, .kp div, .hero, .plc {
  transition: transform .3s var(--ease-pop), box-shadow .3s, border-color .25s, background-color .25s;
}
@media (hover: hover) {
  .card:hover, .gc:hover, .cc:hover { transform: scale(1.04); z-index: 5; border-color: var(--ac); box-shadow: 0 18px 48px rgba(0, 0, 0, .4), 0 0 0 1px rgba(var(--ac-rgb), .5), 0 0 30px rgba(var(--ac-rgb), .22); }
  :root[data-theme="light"] .card:hover, :root[data-theme="light"] .gc:hover, :root[data-theme="light"] .cc:hover { box-shadow: 0 18px 40px rgba(30, 60, 120, .22), 0 0 0 1px rgba(var(--ac-rgb), .5); }
  .kp div:hover { transform: scale(1.08); border-color: var(--ac); }
}
.card, .gc, .cc { position: relative; }

/* Los carriles con scroll recortan lo que crece: se deja aire alrededor */
.rail { padding: 12px 6px; margin: -12px -6px; }
.stage > *, .main > * { overflow: visible; }

/* Móvil: sin crecer tanto para no desbordar */
@media (max-width: 700px) {
  .card:hover, .gc:hover, .cc:hover { transform: scale(1.02); }
  .scene .astro { opacity: calc(var(--astro-op) * .55); width: 52vw; right: -6vw; }
}

/* ---------- Foco visible más claro ---------- */
button:focus-visible, select:focus-visible, input:focus-visible { box-shadow: 0 0 0 4px rgba(var(--ac-rgb), .3); }

@media (prefers-reduced-motion: reduce) {
  .scene .neb, .scene .earth, .scene .astro, .astro .arm-l, .astro .tether, .astro .glint { animation: none !important; }
  .vital-card { transform: none !important; }
}

/* ---------- Fondo según el entorno de la misión (imágenes estáticas, sin animación) ---------- */
.envs > div { position: absolute; opacity: 0; transition: opacity .9s ease; pointer-events: none; background-repeat: no-repeat; }

/* Luna: la mitad izquierda del disco, asomando por el borde derecho */
.env-moon { top: -12vh; right: 0; height: 124vh; width: 62vh; background-image: url("../img/luna.jpg"), var(--img-moon); background-size: auto 100%, 100% 100%; background-position: right center, center; }
/* Marte: planeta grande al fondo */
.env-mars { top: 50%; left: 50%; width: min(118vmin, 980px); aspect-ratio: 1; margin: calc(min(118vmin, 980px) / -2 + 4vh) 0 0 calc(min(118vmin, 980px) / -2 + 6vw); background-image: url("../img/marte.jpg"), var(--img-mars); background-size: contain, 100% 100%; background-position: center, center; }
/* Estación: un tramo de la estación entrando por la izquierda */
.env-iss { left: -14vw; top: 10vh; width: min(80vw, 980px); aspect-ratio: 1500 / 1100; transform: rotate(-8deg); background-image: url("../img/estacion.jpg"), var(--img-iss); background-size: contain, 100% 100%; background-position: center, center; }

:root:not([data-env]) .env-iss, :root[data-env="iss"] .env-iss, :root[data-env="moon"] .env-moon, :root[data-env="mars"] .env-mars { opacity: .92; }
:root[data-theme="light"] .env-iss, :root[data-theme="light"] .env-moon, :root[data-theme="light"] .env-mars { filter: brightness(.9) contrast(1.05); }

/* Limbo de la Tierra: solo desde la estación */
.scene .earth { left: 0; right: 0; bottom: 0; width: 100%; height: auto; aspect-ratio: 2000 / 620; margin: 0; border-radius: 0; box-shadow: none; background: url("../img/tierra.jpg") center bottom / cover no-repeat, var(--img-earth) center bottom / 100% 100% no-repeat; opacity: .95; }
:root[data-env="moon"] .scene .earth, :root[data-env="mars"] .scene .earth { opacity: 0; transition: opacity .9s; }
:root[data-env="moon"] .scene .astro { right: auto; left: 3vw; }

/* Movimiento lento y sereno del fondo */
.scene .astro { display: none; }
.scene .neb { opacity: .6; animation: nebDrift 90s ease-in-out infinite alternate; }
.env-moon { animation: moonDrift 40s ease-in-out infinite alternate; transform-origin: 100% 50%; }
.env-mars { animation: marsDrift 50s ease-in-out infinite alternate; }
.env-iss { animation: issFloat 36s ease-in-out infinite alternate; }
.scene .earth { animation: earthRise 45s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes moonDrift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.12) translate3d(-26px, -30px, 0); } }
@keyframes marsDrift { from { transform: scale(1) translate3d(0, 0, 0) rotate(0deg); } to { transform: scale(1.1) translate3d(-40px, 20px, 0) rotate(4deg); } }
@keyframes issFloat { from { transform: rotate(-8deg) translate3d(0, 0, 0); } to { transform: rotate(-5deg) translate3d(60px, -34px, 0) scale(1.05); } }
@keyframes earthRise { from { transform: scale(1) translateY(0); } to { transform: scale(1.04) translateY(-6px); } }

@media (max-width: 700px) {
  .env-moon { width: 44vh; } .env-iss { width: 120vw; top: 22vh; }
}

/* Menos desenfoque para que el fondo del entorno se distinga detrás de los paneles */

  <script>
/* clinicalconfig.js — toda la configuración clínica. Agregar tripulantes, zonas o parámetros = añadir un objeto. */
"use strict";

const CREW = [
  { id: "c1", name: "Juli Diaz", role: "Comandante", bio: "Especialista EVA · 28 años · 1,62 m · 57 kg", age: 42, h: 162, sens: 1, col: "var(--cw1)" },
  { id: "c2", name: "Mariana Bazán", role: "Médico de vuelo", bio: "Biología espacial · 38 años · 1,68 m · 62 kg", age: 38, h: 168, sens: 1.12, col: "var(--cw2)" },
  { id: "c3", name: "Pablo Gómez", role: "Ing. de sistemas", bio: "Robótica y soporte · 35 años · 1,75 m · 70 kg", age: 35, h: 175, sens: .9, col: "var(--cw3)" }
];

const ENVS = {
  iss: { n: "Estación Espacial (microgravedad)", k: 1, fk: 1, gz: 1, lat: "0,3 s", note: "Órbita baja: microgravedad total, 16 amaneceres al día y comunicación casi inmediata con Tierra." },
  mars: { n: "Tránsito a Marte (espacio profundo)", k: 1.1, fk: 1, gz: 1, lat: "hasta 22 min", note: "Más radiación y retraso de comunicación: el tripulante debe autoevaluarse con autonomía." },
  moon: { n: "Base lunar Artemis (1/6 g)", k: .5, fk: .3, gz: .2, lat: "1,3 s", note: "Gravedad parcial: la pérdida ósea y muscular es menor, pero hay polvo lunar y radiación." }
};

const TABS = [
  { id: "panel", n: "Panel", cm: "" },
  { id: "huesos", n: "Huesos", cm: "Protocolo ARED: sentadilla y peso muerto, bisfosfonatos y vitamina D. El cumplimiento de ejercicio se ajusta en el menú de tripulación." },
  { id: "musculos", n: "Músculos", cm: "Cicloergómetro y resistencia isoinercial (ARED) 45 min diarios." },
  { id: "organos", n: "Órganos", cm: "Control de fluidos, sodio moderado y pantalones de presión negativa (LBNP)." },
  { id: "mente", n: "Evaluaciones", cm: "Registro matutino de sueño, test de colores, reacción y ánimo; obligatorio antes de una EVA o acoplamiento." },
  { id: "registro", n: "Registro", cm: "" },
  { id: "riesgos", n: "Riesgos NASA", cm: "" },
  { id: "plan", n: "Plan de ejercicio", cm: "" }
];

const SN = ["Normal", "Precaución", "Alerta", "Sin sensor"];

/* ---- helpers de modelo fisiológico ---- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const P = (id, n, u, base, v, dir, y, r, d = 1, x = {}) => ({ id, n, u, base, v, dir, y, r, d, ...x });
const dens = r => P("dens", "Densidad ósea relativa", "% del basal", 100, c => 100 - r * c.m * c.f * c.k, "lt", 97, 94);
const load = () => P("load", "Carga mecánica diaria", "% de la meta", 100, c => c.d ? 55 + 45 * c.adh : 100, "lt", 85, 70, 0);
const mus = (id, n, u, b, r, ty = .05, tr = .1, d = 1) => P(id, n, u, b, c => b * (1 - r / 100 * c.m * c.f * c.k), "lt", b * (1 - ty), b * (1 - tr), d);

/* rigidez muscular (miotonómetro): cae con la atrofia/hipotonía en microgravedad. stiff(id, nombre, base, %caída por mes) */
const stiff = (id, n, b, r) => mus(id, n, "N/m", b, r, .05, .1);
const mt = (id, n, u, b, r, dir, y, rd, d = 1) => P(id, n, u, b, c => b * (1 + r / 100 * c.m * c.f * c.k), dir, y, rd, d);
const fl = (id, n, u, b, r, dir, y, rd, d = 1) => P(id, n, u, b, c => b * (1 + r / 100 * c.m * c.fk), dir, y, rd, d);
const ev0 = (id, n, u, fn, y, r) => P(id, n, u, 0, fn, "gt", y, r, 0);

const SI0 = .67 * 85 + .28 * 1600 - 420,
      buaF = c => 85 * (1 - .012 * c.m * c.f * c.k),
      sosF = c => 1600 * (1 - .0015 * c.m * c.f * c.k),
      siF = c => .67 * buaF(c) + .28 * sosF(c) - 420,
      tF = c => (siF(c) - SI0) / 8,
      zF = c => tF(c) + .4,
      lossF = c => (SI0 - siF(c)) / SI0 * 100;

const fiF = c => clamp(Math.round(6 + 5 * Math.max(0, lossF(c)) + 14 * Math.max(0, -(zF(c) + .5))), 0, 100),
      dH = c => 4.6 * (1 - Math.exp(-c.d / 18)) * c.gz;

const Z = (tab, id, n, txt, p, src, sys) => ({ tab, id, n, txt, p, sys: sys || tab, src });
const MSN = "Ecografía muscular, miotonometría y dinamometría manual del cuello.",
      BS = "Modelo de pérdida ósea: ultrasonido del calcáneo (QUS), carga plantar y ARED.",
      MS = "Ecografía muscular, dinamómetro y rendimiento en el ARED.",
      NO = "Este órgano todavía no tiene sensor ni parámetros definidos. Se incorpora sumando una variable a su lista.";

const ZONES = [
  Z("huesos", "craneo", "Cráneo y mandíbula", "El cráneo no soporta peso, por eso casi no pierde densidad. Lo que sí se vigila es la presión dentro de la cabeza (ver Órganos, Cerebro y ojos).", [dens(0)], BS),
  Z("huesos", "cervical", "Columna cervical", "Las vértebras del cuello cargan poco peso incluso en la Tierra, así que pierden poca densidad.", [dens(.3)], BS),
  Z("huesos", "toracica", "Columna torácica", "Se mantiene bastante estable porque se apoya en la caja torácica.", [dens(.5)], BS),
  Z("huesos", "lumbar", "Columna lumbar", "En microgravedad los discos entre las vértebras absorben líquido y se expanden: la estatura aumenta y puede doler la zona lumbar. Además las vértebras pierden carga y densidad, y cambian las curvaturas de la columna (lordosis lumbar y cervical, cifosis torácica).", [dens(1.2), P("dhp", "Ganancia de estatura", "%", 0, c => dH(c) / c.h * 100, "gt", 1, 3), P("disc", "Altura del disco L4-L5", "mm", 10.5, c => 10.5 * (1 + .028 * dH(c)), "gt", 11.55, 12.08), P("lord", "Ángulo de lordosis lumbar", "°", 50, c => 50 * (1 - .055 * dH(c)), "lt", 42.5, 35, 0), mt("cif", "Ángulo de cifosis torácica", "°", 35, 10, "gt", 45, 50, 0), mt("lcerv", "Ángulo de lordosis cervical", "°", 30, -8, "lt", 20, 10, 0), P("vas", "Dolor lumbar", "/10", 0, c => c.d ? c.vas : 0, "gt", 4, 7, 0)], BS),
  Z("huesos", "costillas", "Costillas y esternón", "Las costillas se mueven con cada respiración, por eso conservan mejor su densidad.", [dens(.2)], BS),
  Z("huesos", "humero", "Hombros y brazos (clavícula, escápula, húmero)", "Los brazos no soportan peso en órbita, pero se usan en las caminatas espaciales y en el ejercicio resistivo.", [dens(.3)], BS),
  Z("huesos", "antebrazo", "Antebrazo y mano", "Radio, cúbito y huesos de la mano pierden poca densidad. Se controla la fatiga por el uso del traje de actividad extravehicular.", [dens(.3)], BS),
  Z("huesos", "pelvis", "Pelvis y cadera", "La pelvis normalmente sostiene todo el peso del cuerpo. Sin gravedad es una de las zonas que más hueso pierde, entre 1 % y 2 % por mes sin contramedidas.", [dens(1.6)], BS),
  Z("huesos", "femur", "Fémur y rótula", "Es el hueso más largo y carga peso al caminar. En órbita se adelgaza si no se compensa con ejercicio resistivo.", [dens(1.3), load()], BS),
  Z("huesos", "tibia", "Tibia y peroné", "Reciben el impacto de cada paso en la Tierra. En flotación esa carga desaparece y el hueso empieza a reabsorberse.", [dens(1.1), load()], BS),
  Z("huesos", "pie", "Pie y calcáneo (QUS)", "El talón se mide con ultrasonido cuantitativo porque es hueso esponjoso muy activo. La velocidad y la atenuación de la onda cambian cuando las trabéculas se adelgazan.", [P("si", "Índice de rigidez (SI)", "índice", SI0, siF, "lt", SI0 * .97, SI0 * .92), P("sos", "Velocidad del sonido (SOS)", "m/s", 1600, sosF, "lt", 1576, 1568, 0), P("bua", "Atenuación de banda ancha (BUA)", "dB/MHz", 85, buaF, "lt", 80.75, 78.2), P("t", "T-score estimado", "DE", 0, tF, "lt", -1, -2.5), P("z", "Z-score estimado", "DE", .4, zF, "lt", -.5, -1), P("fi", "Índice de fragilidad", "0 a 100", 6, fiF, "gt", 25, 50, 0), load()], BS),
  Z("musculos", "ecm", "Esternocleidomastoideo", "Flexiona, inclina y rota la cabeza. Sin gravedad ya no sostiene su peso, pero se reactiva al frenar la cabeza en la reentrada y tras el aterrizaje.", [mus("esp", "Espesor del esternocleidomastoideo", "mm", 9, 1.5), mus("rig", "Rigidez del esternocleidomastoideo (miotonómetro)", "N/m", 210, 1.8, .05, .1, 0), mus("fle", "Fuerza de flexión cervical (dinamómetro)", "kgf", 12, 2, .1, .2)], MSN),
  Z("musculos", "trapecio", "Trapecio superior", "Eleva el hombro y extiende e inclina el cuello. Se sobrecarga con el traje de actividad extravehicular y con la tensión de la postura neutra en órbita.", [mus("esp", "Espesor del trapecio superior", "mm", 8, 1.2), mus("rig", "Rigidez del trapecio superior (miotonómetro)", "N/m", 290, 1.5, .05, .1, 0)], MSN),
  Z("musculos", "esplenio", "Esplenio del cuello", "Extiende y rota el cuello del mismo lado. Es un extensor antigravitatorio: sostiene la cabeza en la Tierra y pierde tono en órbita.", [mus("esp", "Espesor del esplenio del cuello", "mm", 12, 2), mus("rig", "Rigidez del esplenio del cuello (miotonómetro)", "N/m", 260, 2.2, .05, .1, 0), mus("ext", "Fuerza de extensión cervical (dinamómetro)", "kgf", 18, 2.2, .1, .2)], MSN),
  Z("musculos", "largocuello", "Largo del cuello y de la cabeza", "Son los flexores profundos del cuello y estabilizan la curvatura cervical. Al ser profundos se evalúan con ecografía y con el test de flexión craneocervical.", [mus("esp", "Espesor del largo del cuello (eco)", "mm", 8, 2.2), mt("ccft", "Test de flexión craneocervical (nivel alcanzado)", "mmHg", 30, -3, "lt", 26, 22, 0)], "Ecografía cervical anterior y test de flexión craneocervical con biofeedback de presión."),
  Z("musculos", "multifidos", "Multífidos cervicales", "Estabilizan cada vértebra del cuello. Son músculos profundos que se atrofian con la falta de carga axial y se evalúan con ecografía o resonancia.", [mus("esp", "Espesor de los multífidos cervicales (eco)", "mm", 10, 2.5), mus("area", "Área transversal de los multífidos (eco)", "cm²", 2.4, 2.8)], "Ecografía o resonancia del cuello (nivel C5)."),
  Z("musculos", "hombros", "Pectoral y hombros", "El deltoides y el pectoral trabajan poco sin gravedad, pero se mantienen mejor que las piernas.", [mus("delt", "Espesor del deltoides", "mm", 28, .9), mus("pec", "Espesor del pectoral mayor", "mm", 22, .9)], MS),
  Z("musculos", "brazos", "Brazos (bíceps y tríceps)", "Bíceps y tríceps pierden poca masa porque se usan para desplazarse y ejercitarse.", [mus("bic", "Espesor del bíceps", "mm", 30, .7), mus("tri", "Espesor del tríceps", "mm", 26, .8), stiff("rigb", "Rigidez del bíceps braquial (miotonómetro)", 12, 1.5)], MS),
  Z("musculos", "antebrazom", "Antebrazo y mano", "La fuerza de agarre se mide con dinamómetro y se compara con el valor previo al vuelo. El traje espacial agrega fatiga.", [mus("grip", "Fuerza de agarre", "kgf", 42, .8), mus("fle", "Espesor de flexores", "mm", 24, .6)], MS),
  Z("musculos", "core", "Abdomen y espalda", "Los músculos que sostienen la postura trabajan menos sin gravedad y pierden tono.", [mus("rec", "Espesor del recto abdominal", "mm", 11, 2), mus("ere", "Espesor de erectores espinales", "mm", 30, 1.8)], MS),
  Z("musculos", "cadera", "Cadera y glúteos", "El glúteo mayor es de los que más se activan al caminar en la Tierra y de los que más pierden en órbita.", [mus("glu", "Espesor del glúteo mayor", "mm", 28, 2.6)], MS),
  Z("musculos", "muslo", "Muslo (cuádriceps)", "El cuádriceps es el gran músculo antigravitatorio. Si el área de corte baja de 60 a 52 cm² en tres meses, el software calcula el porcentaje de cambio y avisa.", [mus("quad", "Área del cuádriceps (eco)", "cm²", 60, 3.6), mus("isq", "Área de isquiotibiales (eco)", "cm²", 34, 2.6), mus("ared", "Repeticiones en ARED (sentadilla, 80 kgf)", "rep", 15, 3, .1, .2), stiff("rigq", "Rigidez del cuádriceps (miotonómetro)", 10, 2.5), stiff("rigi", "Rigidez de isquiotibiales (miotonómetro)", 11, 2)], MS),
  Z("musculos", "pantorrilla", "Pantorrilla", "Sóleo y gastrocnemio sostienen el cuerpo de pie y son los que más rápido se atrofian en microgravedad.", [mus("sur", "Espesor del tríceps sural", "mm", 52, 4), mus("tal", "Elevación de talones (rep)", "rep", 25, 3.5, .1, .2), stiff("rigg", "Rigidez de gemelos (miotonómetro)", 12, 3), stiff("rigs", "Rigidez del sóleo (miotonómetro)", 13, 3)], MS),
  Z("musculos", "bia", "Composición corporal (BIA)", "La bioimpedancia, con electrodos en manos y pies, estima la masa libre de grasa y el agua corporal total; separa pérdida muscular de cambios de líquidos.", [mus("ffm", "Masa libre de grasa (BIA)", "kg", 62, 1.1), P("tbw", "Agua corporal total (BIA)", "L", 45, c => 45 * (1 - .01 * c.m * c.fk), "none", 0, 0)], "Bioimpedancia eléctrica."),
  Z("organos", "cerebro", "Cerebro y ojos", "En microgravedad los líquidos suben hacia la cabeza. Esto puede aumentar la presión dentro del cráneo y deformar la parte posterior del ojo. " + NO, [], "Sin sensor.", "Neuro-ocular"),
  Z("organos", "vasos", "Cuello: yugular y carótida", "La sangre se acumula en el cuello y la vena yugular puede estancarse, con riesgo de coágulos. Las arterias además se vuelven más rígidas.", [P("ijv", "Estasis de la vena yugular", "grado 1 a 4", 1, c => 1 + .012 * c.d * c.fk, "gt", 2, 3), fl("stif", "Rigidez carotídea", "m/s", 6, 2, "gt", 6.36, 6.72, 2)], "Ecografía vascular Doppler.", "Cardiovascular"),
  Z("organos", "pulmones", "Pulmones", "Sin gravedad las vísceras abdominales suben y el diafragma se eleva: baja la capacidad residual. También se vigila el polvo en cabina y tras caminatas espaciales.", [fl("fvc", "Capacidad vital forzada", "L", 4.8, -1.4, "lt", 4.56, 4.32, 2), fl("fev1", "Volumen espiratorio en 1 s", "L", 3.9, -1.1, "lt", 3.7, 3.51, 2), fl("frc", "Capacidad residual funcional", "L", 2.6, -2.8, "lt", 2.21, 2.08, 2), fl("spo2", "Saturación de oxígeno", "%", 98, -.1, "lt", 95, 94), fl("pi", "Índice de perfusión", "%", 4, -4, "lt", 1, .5)], "Espirometría y oximetría de pulso.", "Respiratorio"),
  Z("organos", "corazon", "Corazón", "Sin gravedad el corazón trabaja menos y se achica un poco. También cambia la regulación de la presión al ponerse de pie, lo que causa mareos al volver a la gravedad.", [fl("lvef", "Volumen sistolico", "%", 62, -.8, "lt", 55, 50), mt("lvm", "Índice de masa del ventrículo izquierdo", "g/m²", 80, -2.5, "lt", 74, 72), fl("sv", "Volumen sistólico", "mL", 78, -2.6, "lt", 70, 66.3), fl("hr", "Frecuencia cardíaca en reposo", "lpm", 66, 1.2, "gt", 85, 95, 0), fl("hrv", "Variabilidad de la frecuencia (RMSSD)", "ms", 52, -4, "lt", 45, 39, 0), fl("ort", "Índice de tolerancia ortostática", "0 a 100", 90, -4.5, "lt", 75, 60, 0), fl("sbp", "Presión sistólica", "mmHg", 118, .6, "gt", 130, 140, 0), fl("dbp", "Presión diastólica", "mmHg", 76, .5, "gt", 85, 90, 0)], "Ecocardiografía, Holter, tensiómetro y prueba de presión negativa (LBNP).", "Cardiovascular"),
  Z("organos", "higado", "Hígado y glucosa", "El hígado regula la glucosa. Aunque aún no tiene sensor propio, la glucosa capilar es un indicador básico de autoevaluación (estrés, nutrición y resistencia a la insulina).", [fl("glu", "Glucosa en sangre", "mg/dL", 90, .4, "gt", 110, 126, 0)], "Glucómetro capilar.", "Metabólico"),
  Z("organos", "estomago", "Estómago", "\u200b" + NO, [], "Sin sensor.", "Otro"),

/* anatomy.js — modelo anatómico vectorial completo (viewBox 200×470).
   Se dibuja la mitad izquierda y se espeja.
   Capas: silueta + huesos, músculos y órganos.
   Cada zona es un <g class="z"> con data-z = id de zona. */
"use strict";

/* Helpers de primitivas SVG */
const sym = (s) => `${s}<g transform="translate(200 0) scale(-1 1)">${s}</g>`;

const Rc = (x, y, w, h, r = 2, c = "f") =>
  `<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;

const Ln = (x1, y1, x2, y2, w, c = "s") =>
  `<path class="${c}" style="stroke-width:${w}" d="M${x1} ${y1}L${x2} ${y2}"/>`;

const El = (cx, cy, rx, ry, c = "f", rot = 0) =>
  `<ellipse class="${c}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${
    rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ""
  }/>`;

const Ci = (cx, cy, r, c = "f") =>
  `<circle class="${c}" cx="${cx}" cy="${cy}" r="${r}"/>`;

const Pa = (d, c = "f") => `<path class="${c}" d="${d}"/>`;

/* Pila de vértebras con apófisis transversas */
const stack = (y, n, w0, w1, h, g, tp) =>
  Array.from({ length: n }, (_, i) => {
    const w = w0 + ((w1 - w0) * i) / Math.max(1, n - 1);
    const yy = y + i * (h + g);
    const rect = Rc(100 - w / 2, yy, w, h, 2);
    const processes = tp
      ? `<path class="s" style="stroke-width:1.5" d="M${100 - w / 2 - tp} ${
          yy + h / 2
        }H${100 - w / 2}M${100 + w / 2} ${yy + h / 2}H${100 + w / 2 + tp}"/>`
      : "";

    return rect + processes;
  }).join("");

/* Caja torácica: 10 costillas verdaderas/falsas + 2 flotantes */
const ribs = () => {
  const trueAndFalseRibs = Array.from({ length: 10 }, (_, i) => {
    const y0 = 94 + i * 7.4;
    const w = 11 + 18 * Math.sin((Math.PI * (i + 0.7)) / 11);
    const x = 100 - w;
    const y1 = y0 + 14 - (i >= 7 ? (i - 6) * 3 : 0);

    return sym(
      `<path class="s" style="stroke-width:1.9" d="M96 ${y0}C${
        100 - w * 0.6
      } ${y0 - 7} ${x} ${y0 - 1} ${x} ${y0 + 10}C${x} ${y0 + 20} ${
        100 - w * 0.35
      } ${y1 + 5} 98.5 ${y1}"/>`
    );
  }).join("");

  const floatingRibs = sym(
    `<path class="s" style="stroke-width:1.7" d="M96 168C86 168 78 175 75 184M96 176C88 178 82 187 80 193"/>`
  );

  return trueAndFalseRibs + floatingRibs;
};

/* Dedos de la mano */

/* importer.js — lector CSV que respeta comillas y validación de filas importadas (CSV o SVG). Funciones puras, sin DOM. */
"use strict";

const norm = s => String(s == null ? "" : s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/* CSV: no divide a ciegas por comas. Una coma, un punto y coma o un salto de línea dentro de comillas pertenece al campo;
   "" dentro de un campo entrecomillado es una comilla literal. Detecta "," o ";" mirando solo la primera línea fuera de comillas. */
function csvParse(text) {
  text = String(text).replace(/^\uFEFF/, "");
  let q = false, nc = 0, ns = 0;
  
  for (const ch of text) {
    if (ch === '"') {
      q = !q;
    } else if (!q) {
      if (ch === "\n" || ch === "\r") break;
      if (ch === ",") nc++;
      else if (ch === ";") ns++;
    }
  }

  const D = ns > nc ? ";" : ",";
  const rows = [];
  let row = [], f = "", inQ = false;

  const end = () => {
    row.push(f);
    f = "";
    if (row.some(x => x.trim() !== "")) rows.push(row);
    row = [];
  };

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          f += '"';
          i++;
        } else {
          inQ = false;
        }
      } else {
        f += ch;
      }
    } else if (ch === '"' && f === "") {
      inQ = true;
    } else if (ch === D) {
      row.push(f);
      f = "";
    } else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      end();
    } else {
      f += ch;
    }
  }

  if (inQ) throw new Error("Comillas sin cerrar en el CSV");
  if (f !== "" || row.length) end();
  
  return rows;
}

/* número: acepta "58.2" y "58,2" (coma decimal); cualquier otra cosa es NaN */
function parseNum(x) {
  let t = String(x == null ? "" : x).trim().replace(/\s/g, "");
  if (t === "") return NaN;
  if (/^[-+]?\d+,\d+$/.test(t)) t = t.replace(",", ".");
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t) ? +t : NaN;
}

/* tabla -> filas {c,d,k,v}. Formato largo: dia,tripulante,parametro,valor. Formato ancho: dia,[tripulante],zona.param,zona.param… */
function tableToRows(t) {
  if (t.length < 2) return { rows: [], err: "El CSV no tiene filas de datos." };

  const h = t[0].map(norm),
        at = n => h.findIndex(x => n.includes(x)),
        iD = at(["dia", "day"]);

  if (iD < 0) return { rows: [], err: 'Falta la columna "dia".' };

  const iC = at(["tripulante", "crew", "persona"]),
        iK = at(["parametro", "clave", "key"]),
        iV = at(["valor", "value"]),
        skip = ["nota", "notas", "observacion", "observaciones"],
        rows = [];

  t.slice(1).forEach(r => {
    const c = iC >= 0 ? (r[iC] || "").trim() : "",
          d = parseNum(r[iD]);

    if (iK >= 0 && iV >= 0) {
      rows.push({ c, d, k: (r[iK] || "").trim(), v: parseNum(r[iV]) });
    } else {
      t[0].forEach((name, j) => {
        if (j === iD || j === iC || skip.includes(h[j]) || !(r[j] || "").trim()) return;
        rows.push({ c, d, k: name.trim(), v: parseNum(r[j]) });
      });
    }
  });

  return { rows };
}

/* validación: o = {today, known:Set, crew:fn(texto)->id|null, negOk:fn(clave)->bool} */
function validateRows(rows, o) {
  const good = [],
        rej = { crew: 0, unk: 0, bad: 0, neg: 0, rng: 0 };

  rows.forEach(r => {
    const c = o.crew(r.c);
    if (c == null) {
      rej.crew++;
      return;
    }
    if (!o.known.has(r.k)) {
      rej.unk++;
      return;
    }
    if (!Number.isFinite(r.v)) {
      rej.bad++;
      return;
    }
    if (r.v < 0 && !o.negOk(r.k)) {
      rej.neg++;
      return;
    }
    if (!Number.isInteger(r.d) || r.d < 0 || r.d >= o.today) {
      rej.rng++;
      return;
    }
    good.push({ c, d: r.d, k: r.k, v: r.v });
  });

  return { good, rej };
}

/* js/core/store.js — Persistencia de registros (localStorage). */
"use strict";

/* ---------- StorageManager ---------- */
const Store = {
  K: "orbital_logs_v4",
  ver: 0,
  _r: null,
  _o: {},
  all() {
    try {
      const r = localStorage.getItem(this.K) || "{}";
      if (r !== this._r) { this._o = JSON.parse(r); this._r = r; }
      return this._o;
    } catch (e) { return {}; }
  },
  days(c) { return this.all()[c] || {}; },
  get(c, d) { return this.days(c)[d]; },
  put(c, d, patch) {
    try {
      const a = this.all(),
            r = (a[c] = a[c] || {})[d] = a[c][d] || { v: {}, t: {} };
      Object.assign(r.v, cleanV(patch.v));
      Object.assign(r.t, patch.t || {});
      if (patch.n != null) r.n = patch.n;
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}
  },
  setZone(c, d, zid, v, n) {
    try {
      const a = this.all(),
            r = (a[c] = a[c] || {})[d] = a[c][d] || { v: {}, t: {} };
      Object.keys(r.v).forEach(k => { if (k.indexOf(zid + ".") === 0) delete r.v[k]; });
      Object.assign(r.v, cleanV(v));
      r.zn = r.zn || {};
      if (n) r.zn[zid] = n; else delete r.zn[zid];
      if (!Object.keys(r.v).length && !Object.keys(r.t || {}).length && !Object.keys(r.zn).length && !r.n) delete a[c][d];
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}
  },
  del(c, d) {
    try {
      const a = this.all();
      if (a[c]) delete a[c][d];
      (localStorage.setItem(this.K, JSON.stringify(a)), Store.ver++);
    } catch (e) {}
  }
};

/* js/ui/chart.js — Gráfico de línea SVG de evolución por parámetro. */
"use strict";

/* ---------- Gráfico de línea ---------- */
let UID = 0;
function lineChartRaw(z, p, o = {}) {
  const W = o.w || 340,
        H = o.h || 170,
        L = o.mini ? 30 : 34,
        R = 8,
        T = 10,
        B = 22,
        cr = crewOf(),
        key = z.id + "." + p.id,
        id = "lg" + (UID++);
  
  const XM = Math.max(30, S.today),
        stp = Math.max(1, Math.ceil(XM / 60)),
        model = [];
  
  for (let d = 0; d < XM; d += stp) model.push([d, p.v(C(d, cr))]);
  model.push([XM, p.v(C(XM, cr))]);

  const realOf = c => Object.entries(Store.days(c.id)).filter(([d, r]) => +d <= XM && r.v && r.v[key] != null).map(([d, r]) => [+d, r.v[key]]).sort((a, b) => a[0] - b[0]);
  const real = realOf(cr);
  /* Con "Comparar": se dibujan TODOS los tripulantes (no solo el seleccionado), cada uno con su modelo y sus datos reales. */
  const others = o.cmp ? CREW.filter(x => x.id !== cr.id).map(x => ({ x, pts: model.map(m => [m[0], p.v(C(m[0], x))]), real: realOf(x) })) : [];

  const vals = [...model.map(a => a[1]), ...real.map(a => a[1]), ...others.flatMap(q => [...q.pts.map(a => a[1]), ...q.real.map(a => a[1])]), p.base];
  if (p.dir !== "none") vals.push(p.y, p.r);
  
  let mn = Math.min(...vals),
      mx = Math.max(...vals);
  const pad = ((mx - mn) || 1) * .1;
  const nonneg = Math.min(...vals) >= 0;
  mn -= pad;
  mx += pad;
  if (nonneg && mn < 0) mn = 0;
  
  const sp = mx - mn,
        X = d => L + d / XM * (W - L - R),
        Y = v => T + (1 - (v - mn) / sp) * (H - T - B),
        cl = v => clamp(v, mn, mx),
        dec = p.d || (sp < 4 ? 1 : 0),
        tk = v => {
          const s = v.toFixed(dec);
          return (+s === 0 ? (0).toFixed(dec) : s).replace(".", ",");
        };

  const band = (a, b, c) => {
    const y1 = Y(cl(Math.max(a, b))),
          y2 = Y(cl(Math.min(a, b)));
    return y2 - y1 > .5 ? `<rect x="${L}" y="${y1}" width="${W - L - R}" height="${y2 - y1}" fill="${c}" opacity=".1"/>` : "";
  };

  const bands = p.dir === "none" ? "" : p.dir === "lt" ? band(mn, p.r, SC[2]) + band(p.r, p.y, SC[1]) + band(p.y, mx, SC[0]) : band(mn, p.y, SC[0]) + band(p.y, p.r, SC[1]) + band(p.r, mx, SC[2]);
  const th = (v, c) => p.dir === "none" && c !== "var(--ac)" ? "" : `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-opacity=".85" stroke-dasharray="4 3"/>`;
  const pl = a => a.map(q => X(q[0]).toFixed(1) + "," + Y(q[1]).toFixed(1)).join(" ");
  const area = `M${X(0)},${Y(mn)} L${pl(model).replace(/ /g, " L")} L${X(XM)},${Y(mn)}Z`;
  
  const rec = Store.get(cr.id, S.day),
        isReal = !!(rec && rec.v && rec.v[key] != null),
        cv = isReal ? rec.v[key] : p.v(C(S.day, cr)),
        cs = stat(p, cv),
        col = cs < 0 ? "var(--ac)" : SC[cs];
        
  const grid = [mn, (mn + mx) / 2, mx].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-opacity=".1"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end" fill="var(--mu)" font-size="9">${tk(v)}</text>`).join("");
  const xt = [0, Math.round(XM / 3), Math.round(XM * 2 / 3), XM].map(d => `<line x1="${X(d)}" x2="${X(d)}" y1="${T}" y2="${H - B}" stroke="var(--grid)" stroke-opacity=".07"/><text x="${X(d)}" y="${H - 7}" text-anchor="${d === 0 ? "start" : d === XM ? "end" : "middle"}" fill="var(--mu)" font-size="9">${d === 0 ? "Día 0" : d}</text>`).join("");

  return `<svg class="u-w-100pct u-h-auto u-d-block" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${esc(p.n)} de ${esc(cr.name)}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${cr.col}" stop-opacity=".28"/><stop offset="1" stop-color="${cr.col}" stop-opacity="0"/></linearGradient></defs>${bands}${grid}${xt}${th(p.base, "var(--ac)")}${th(p.y, SC[1])}${th(p.r, SC[2])}<path d="${area}" fill="url(#${id})"/>${others.map(q => `<polyline fill="none" stroke="${q.x.col}" stroke-width="2.2" stroke-linejoin="round" points="${pl(q.pts)}"/>${q.real.length > 1 ? `<polyline fill="none" stroke="${q.x.col}" stroke-opacity=".9" stroke-width="1.4" stroke-dasharray="4 2" points="${pl(q.real)}"/>` : ""}${q.real.map(a => `<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="3.4" fill="${q.x.col}" stroke="var(--sel)" stroke-width="1.1"><title>${esc(q.x.name)} · día ${a[0]}: ${fmt(p, a[1])} ${esc(p.u)}</title></circle>`).join("")}`).join("")}<polyline fill="none" stroke="${cr.col}" stroke-width="2.2" stroke-linejoin="round" points="${pl(model)}"/>${real.length > 1 ? `<polyline fill="none" stroke="var(--sel)" stroke-opacity=".9" stroke-width="1.6" points="${pl(real)}"/>` : ""}${real.map(a => `<circle data-day="${a[0]}" data-k="${key}" data-v="${a[1]}" cx="${X(a[0])}" cy="${Y(a[1])}" r="3.8" fill="${SC[stat(p, a[1]) < 0 ? 0 : stat(p, a[1])]}" stroke="var(--sel)" stroke-width="1.2"><title>Día ${a[0]}: ${fmt(p, a[1])} ${esc(p.u)}</title></circle>`).join("")}<line x1="${X(S.day)}" x2="${X(S.day)}" y1="${T}" y2="${H - B}" stroke="var(--sel)" stroke-opacity=".4"/>${others.map(q => { const rc = Store.get(q.x.id, S.day), v = rc && rc.v && rc.v[key] != null ? rc.v[key] : p.v(C(S.day, q.x)); return `<circle cx="${X(S.day)}" cy="${Y(v)}" r="4" fill="${q.x.col}" stroke="var(--bg)" stroke-width="2"/>`; }).join("")}<circle cx="${X(S.day)}" cy="${Y(cv)}" r="4.6" fill="${col}" stroke="var(--bg)" stroke-width="2"/></svg>`;
}

const MEMO = new Map(),
      memo = (k, f) => {
        let v = MEMO.get(k);
        if (v === undefined) {
          if (MEMO.size > 400) MEMO.clear();
          MEMO.set(k, v = f());
        }

      };

const dsig = () => { const k = cfg(); return [S.crew, S.env, k.adh, k.vas, S.day, S.today, Store.ver].join("|"); };
const lineChart = (z, p, o = {}) => memo(["lc", z.id, p.id, o.w, o.h, o.mini ? 1 : 0, o.cmp ? 1 : 0, dsig()].join("|"), () => lineChartRaw(z, p, o));
const chart = (z, p) => lineChart(z, p, { w: 320, h: 170, cmp: S.cmp });

${rows.length ? `<div class="u-ox-auto u-mt-10"><table class="tb"><tr><th>Día</th>${z.p.map(p => `<th>${esc(p.n)}</th>`).join("")}<th>Observación</th></tr>${rows.map(([d, r]) => `<tr class="${+d === S.day ? "cur" : ""}"><td><button class="chip" data-day="${d}">${d}</button></td>${z.p.map(p => { const v = r.v[pre + p.id]; return v == null ? "<td>—</td>" : `<td class="mono t${Math.max(0, stat(p, v))}">${fmt(p, v)}</td>`; }).join("")}<td>${esc((r.zn && r.zn[z.id]) || "")}</td></tr>`).join("")}</table></div>` : `<p class="u-c-mu u-fs-13">Aún no hay registros reales de esta zona. Guarda el primero en el formulario; mientras tanto la curva es el modelo simulado.</p>`}</div>`;

function viewRegistro() {
  const cr = crewOf(),
        L = S.rl,

<div class="two fig"><div class="g pn"><div class="row u-jc-center u-mb-6">${RL.map(l => `<button class="chip ${l[0] === L ? "on" : ""}" data-rl="${l[0]}">${l[1]}</button>`).join("")}</div><div class="svgw" id="svgw">${zoneFig(L, zs, sel, 1)}</div>${legend()}
<div class="row u-mt-10 u-jc-center">${zs.map(z => { const st = Engine.ev(z).st; return `<button class="chip zc ${z.id === sel.id ? "on" : ""}" data-z="${z.id}"><i class="dot t${st}"></i>${z.n.split(" (")[0]}</button>`; }).join("")}</div></div>
<div class="u-d-grid u-gap-12 u-ac-start"><div class="g pn" id="regform">${regForm(sel)}</div>${regHistory(sel)}</div></div>
<div class="g pn"><b>Pruebas y autorregistros del día ${S.day}</b><p class="u-m-2-0-10 u-c-mu u-fs-13">Sueño, memoria, reacción, ánimo y esfuerzo se registran con sus propias pruebas.</p><div class="rw"><button class="ib" data-r="cards" data-d="-1" aria-label="Anterior">‹</button><div class="rail" id="cards">${cards(ZONES.filter(z => z.tab === "mente"), "", 1)}</div><button class="ib" data-r="cards" data-d="1" aria-label="Siguiente">›</button></div></div>`;
}

function renderChrome() {
  const cr = crewOf(),
        al = Engine.alerts(),
        cx = Engine.cross(al),
        sm = Engine.summary(cr),
        n = sm.n,

  $("dd").textContent = S.day + " / " + S.today;
  $("day").max = S.today;
  $("day").value = S.day;
  for (const i of ["env", "env2"]) $(i).value = S.env;
  $("envnote").textContent = ENVS[S.env].note + " Latencia de comunicación: " + ENVS[S.env].lat + ".";
  $("adh").value = k.adh;
  $("adho").textContent = k.adh + " %";
  $("vas").value = k.vas;
  $("vaso").textContent = k.vas;
  $("crew").innerHTML = CREW.map(x => `<button class="crew ${x.id === S.crew ? "on" : ""}" data-c="${x.id}"><div class="av" style="background:${x.col};color:var(--on-ac)">${x.name.split(" ")[1][0]}</div><div><b>${x.name}</b><span>${x.role}</span></div></button>`).join("");
  $("hero").innerHTML = `<div>${bd(w)}<h2>${cr.name}</h2><p>${cr.role} · ${cr.bio}</p></div><div class="kp">${n.map((v, i) => `<div><small>${SN[i]}</small><b class="mono t${i}">${v}</b></div>`).join("")}</div>
<details class="u-w-100pct"><summary>Alertas activas (${al.length})</summary>${al.length ? al.map(a => `<p>${bd(a.r.s)} ${a.z.n} · ${a.r.p.n}: <b class="mono">${fmt(a.r.p, a.r.v)} ${a.r.p.u}</b></p>`).join("") : "<p>Sin alertas: todos los parámetros están dentro de lo esperado.</p>"}${cx.map(t => `<p class="t1">${t}</p>`).join("")}</details>`;
  $("tabs").innerHTML = TABS.map(t => `<button class="tab ${t.id === S.tab ? "on" : ""}" data-t="${t.id}">${t.ic ? t.ic + " " : ""}${t.n}</button>`).join("");
}

function render() { Nav.render(); }
function State(p) { Object.assign(S, p); Nav.render(); }
function toast(t) {
